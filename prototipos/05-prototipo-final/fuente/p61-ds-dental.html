
<script>
/* ===========================================================================
   DEMO 01 · CLÍNICA DENTAL AURORA — precios visibles y cita en cuatro pasos
   =========================================================================== */
DEMOS.dental = {
  mount: function (root, l) {
    var L = DS.lang(l), money = DS.money, esc = DS.esc;
    var db = DS.store('aurora');

    var TREAT = [
      { id: 'limp', n: L('Valoración y limpieza', 'Check-up & cleaning'), d: L('Revisión completa, profilaxis y plan de tratamiento', 'Full exam, prophylaxis and treatment plan'), min: 45, p: 120000 },
      { id: 'resi', n: L('Resina estética', 'Tooth-coloured filling'), d: L('Por superficie, color natural, una sola sesión', 'Per surface, natural colour, one visit'), min: 40, p: 150000 },
      { id: 'blan', n: L('Blanqueamiento LED', 'LED whitening'), d: L('Hasta 6 tonos, incluye kit para casa', 'Up to 6 shades, home kit included'), min: 60, p: 450000 },
      { id: 'orto', n: L('Valoración de ortodoncia', 'Orthodontic assessment'), d: L('Brackets o alineadores, con radiografía', 'Braces or aligners, with X-ray'), min: 30, p: 0 },
      { id: 'urge', n: L('Urgencia', 'Emergency visit'), d: L('Dolor, fractura o inflamación, el mismo día', 'Pain, fracture or swelling, same day'), min: 30, p: 90000 }
    ];
    var PROS = [
      { id: 'any', n: L('Primer profesional disponible', 'First available'), d: L('Te asignamos quien tenga el hueco', 'We assign whoever has the slot'), ini: '∗' },
      { id: 'laura', n: 'Dra. Laura Gómez', d: L('Estética dental · 12 años', 'Cosmetic dentistry · 12 years'), ini: 'LG' },
      { id: 'andres', n: 'Dr. Andrés Mejía', d: L('Ortodoncia · 9 años', 'Orthodontics · 9 years'), ini: 'AM' },
      { id: 'paula', n: 'Dra. Paula Ríos', d: L('Odontología general · 7 años', 'General dentistry · 7 years'), ini: 'PR' }
    ];
    var HOURS = [null, ['08:00', '18:00'], ['08:00', '18:00'], ['08:00', '18:00'], ['08:00', '18:00'], ['08:00', '18:00'], ['08:00', '13:00']];
    var DAYS = DS.days(10, [0]);
    function slotsFor(d) { var h = HOURS[d.getDay()]; return h ? DS.range(h[0], h[1], 30).filter(function (t) { return t < '12:00' || t >= '14:00'; }) : []; }
    function busy(pi, d, t) { return DS.seeded(d.getDate() * 5 + pi, DS.minutes(t) / 30) < 0.36; }
    function freePro(d, t, proIdx) {
      if (DS.past(d, t, 60)) return -1;
      if (proIdx > 0) return busy(proIdx, d, t) ? -1 : proIdx;
      for (var i = 1; i < PROS.length; i++) if (!busy(i, d, t)) return i;
      return -1;
    }
    function firstFree() {
      for (var i = 0; i < DAYS.length; i++) {
        var s = slotsFor(DAYS[i]);
        for (var j = 0; j < s.length; j++) if (freePro(DAYS[i], s[j], 0) > 0) return { d: DAYS[i], t: s[j] };
      }
      return null;
    }

    var S = { step: 0, t: null, p: 0, d: 0, s: null, name: '', phone: '', email: '', first: true, note: '', consent: false, done: null };
    var STEPS = [L('Tratamiento', 'Treatment'), L('Profesional', 'Dentist'), L('Fecha y hora', 'Date & time'), L('Tus datos', 'Your details')];
    var ff = firstFree();

    root.className = 'dm ds ds-dental';
    root.innerHTML =
      DS.header({ brand: 'Aurora', mark: 'A', ctaTo: 'reservar', cta: L('Reservar cita', 'Book'), nav: [['tratamientos', L('Tratamientos', 'Treatments')], ['reservar', L('Reservar', 'Book')], ['equipo', L('Equipo', 'Team')], ['opiniones', L('Opiniones', 'Reviews')], ['ubicacion', L('Ubicación', 'Location')]] }) +

      '<section class="ds-hero"><div class="ds-wrap ds-hero__grid"><div>' +
        '<span class="ds-eyebrow">' + L('Odontología general y estética · El Poblado', 'General & cosmetic dentistry · El Poblado') + '</span>' +
        '<h1 class="ds-h1" style="margin-top:14px">' + L('Tu próxima cita, en dos minutos.', 'Your next appointment, in two minutes.') + '</h1>' +
        '<p class="ds-lede">' + L('Ves el precio antes de venir, eliges el horario en línea y te recordamos la cita por WhatsApp. Así de simple debería ser ir al odontólogo.', 'See the price before you come, pick your time online and get a WhatsApp reminder. Going to the dentist should be this simple.') + '</p>' +
        '<div class="ds-actions"><a class="ds-btn" href="#ds-reservar" data-go="reservar">' + L('Reservar cita', 'Book an appointment') + '</a><a class="ds-btn ds-btn--ghost" href="#ds-tratamientos" data-go="tratamientos">' + L('Ver precios', 'See prices') + '</a></div>' +
        '<div class="ds-badges"><div><strong>4,9 ★</strong><span>' + L('1.240 reseñas', '1,240 reviews') + '</span></div><div><strong>15 ' + L('años', 'years') + '</strong><span>' + L('en El Poblado', 'in El Poblado') + '</span></div><div><strong>' + L('12 h', '12 h') + '</strong><span>' + L('cancelación gratis', 'free cancellation') + '</span></div></div>' +
      '</div><div class="ds-hero__img">' + DS.photo('dentalHero', L('Consultorio de la clínica con sillón y escritorio', 'Clinic room with chair and desk')) +
        (ff ? '<div class="ds-float"><span class="ds-dot"></span><span>' + L('Próximo hueco libre: ', 'Next free slot: ') + '<strong>' + (DS.isToday(ff.d) ? L('hoy', 'today') : DS.dayLong(ff.d, l)) + ' · ' + DS.hm(ff.t, l) + '</strong></span></div>' : '') +
      '</div></div></section>' +

      DS.section('tratamientos', L('Precios claros', 'Clear prices'), L('Sabes cuánto cuesta antes de sentarte.', 'You know the cost before you sit down.'),
        L('Precios finales en pesos colombianos, con IVA incluido cuando aplica. Aceptamos tarjeta, Nequi y Daviplata.', 'Final prices in Colombian pesos, VAT included where it applies. Cards, Nequi and Daviplata accepted.'),
        '<div class="ds-split"><div>' + DS.prices(TREAT.map(function (t) { return [t.n, t.d, t.min + ' min', t.p ? money(t.p) : L('Gratis', 'Free')]; }).concat([[L('Diseño de sonrisa', 'Smile makeover'), L('Carillas en resina o porcelana, previa valoración', 'Resin or porcelain veneers, after assessment'), '', L('desde ', 'from ') + money(1800000)]])) + '</div>' +
        '<div>' + DS.features([
          [L('Precio antes de sentarte', 'Price before you sit'), L('Si el plan cambia durante la consulta, te lo explicamos y decides tú. Nada se cobra sin tu visto bueno.', 'If the plan changes during the visit we explain it and you decide. Nothing is charged without your OK.')],
          [L('Puntualidad', 'On time'), L('Agenda con márgenes reales entre pacientes. Si nos retrasamos más de 15 minutos, la limpieza va por nuestra cuenta.', 'Realistic gaps between patients. If we run more than 15 minutes late, the cleaning is on us.')],
          [L('Recordatorio por WhatsApp', 'WhatsApp reminder'), L('24 horas antes te llega un mensaje para confirmar o cambiar la cita sin llamar.', '24 hours before you get a message to confirm or reschedule without calling.')]
        ]).replace('ds-grid--3', '') + '</div></div>', false) +

      DS.section('reservar', L('Reserva en línea', 'Book online'), L('Elige tratamiento, profesional y hora.', 'Choose treatment, dentist and time.'), '',
        '<div class="ds-book"><div class="ds-book__main" id="dxMain"></div><aside class="ds-book__side" id="dxSide"></aside></div>', true) +

      DS.section('equipo', L('Equipo', 'Team'), L('Tres especialistas, una misma forma de trabajar.', 'Three specialists, one way of working.'), '',
        '<div class="ds-grid ds-grid--3">' + PROS.slice(1).map(function (p) {
          return '<div class="ds-card"><div class="ds-avatar" style="width:56px;height:56px;font-size:18px">' + p.ini + '</div><h3 class="ds-h3" style="margin-top:14px">' + p.n + '</h3><p class="ds-muted" style="margin-top:4px">' + p.d + '</p></div>';
        }).join('') + '</div>', false) +

      DS.section('opiniones', L('Opiniones', 'Reviews'), L('Lo que dicen quienes ya vinieron.', 'What past patients say.'), L('Reseñas de ejemplo para esta demo.', 'Sample reviews for this demo.'),
        DS.reviews([
          [5, L('Reservé a las once de la noche y a las nueve ya estaba sentada. El precio fue exactamente el de la web.', 'I booked at 11 pm and was in the chair by 9 am. The price was exactly what the site said.'), 'Catalina', 'Envigado'],
          [5, L('Por fin un odontólogo puntual. Me escribieron el día anterior para confirmar y listo.', 'Finally a dentist who is on time. They messaged me the day before to confirm and that was it.'), 'Julián', 'Laureles'],
          [4, L('La valoración de ortodoncia fue gratis de verdad y me explicaron todas las opciones sin presión.', 'The orthodontic assessment really was free and they explained every option with no pressure.'), 'Mariana', 'Belén']
        ]), true) +

      DS.section('ubicacion', L('Horario y ubicación', 'Hours & location'), L('A tres minutos de la estación Poblado.', 'Three minutes from Poblado station.'), '',
        DS.visit({ hours: HOURS, address: 'Cra. 43A #7-50, ' + L('consultorio', 'suite') + ' 402', area: 'El Poblado, Medellín', note: L('Urgencias con cita el mismo día, en horario de atención.', 'Same-day emergency appointments during opening hours.') }, l), false) +

      DS.section('faq', L('Preguntas frecuentes', 'FAQ'), L('Antes de venir.', 'Before you come.'), '',
        DS.faq([
          [L('¿Atienden urgencias sin cita?', 'Do you see emergencies without an appointment?'), L('Sí, dentro del horario. Reservar la urgencia en línea te asegura el primer hueco libre y evita esperas.', 'Yes, during opening hours. Booking the emergency online secures the first free slot and avoids waiting.')],
          [L('¿Puedo pagar a cuotas?', 'Can I pay in instalments?'), L('En tratamientos desde $600.000 ofrecemos financiación hasta 12 meses con tarjeta de crédito o crédito directo.', 'For treatments from $600,000 we offer up to 12 months with a credit card or direct credit.')],
          [L('¿Cómo cancelo o cambio la cita?', 'How do I cancel or reschedule?'), L('Desde el recordatorio de WhatsApp o en “Mis citas” en esta misma página. Es gratis hasta 12 horas antes.', 'From the WhatsApp reminder or under “My appointments” on this page. Free up to 12 hours before.')],
          [L('¿Qué pasa con mis datos?', 'What happens to my data?'), L('Solo los usamos para gestionar tu cita, conforme a la Ley 1581 de 2012 de protección de datos personales.', 'We only use them to manage your appointment, under Colombia’s Law 1581 of 2012 on personal data protection.')]
        ]), true) +

      DS.footer({ brand: 'Aurora', mark: 'A', tagline: L('Clínica dental en El Poblado. Precios claros, citas puntuales.', 'Dental clinic in El Poblado. Clear prices, punctual appointments.'),
        cols: [[L('Clínica', 'Clinic'), [[L('Tratamientos', 'Treatments'), 'tratamientos'], [L('Equipo', 'Team'), 'equipo'], [L('Opiniones', 'Reviews'), 'opiniones']]],
               [L('Contacto', 'Contact'), [['WhatsApp', null, 'wa'], ['+57 604 000 0000', null, 'tel'], ['hola@aurora.demo', null, 'mail']]],
               [L('Legal', 'Legal'), [[L('Tratamiento de datos', 'Data policy'), null], [L('Términos', 'Terms'), null]]]] }, l);

    DS.chrome(root, l);
    var main = root.querySelector('#dxMain'), side = root.querySelector('#dxSide');

    function T() { return S.t === null ? null : TREAT[S.t]; }
    function mine() { return DS.arr(db.get('citas', [])).filter(function (c) { return c && typeof c === 'object'; }); }

    function drawSide() {
      var t = T(), pro = S.p, when = S.s ? DS.dayLong(DAYS[S.d], l) + ' · ' + DS.hm(S.s, l) : '—';
      var list = mine();
      side.innerHTML = '<div class="ds-sum"><h3 class="ds-step-h" style="font-size:1rem">' + L('Resumen', 'Summary') + '</h3><dl>' +
        '<dt>' + L('Tratamiento', 'Treatment') + '</dt><dd>' + (t ? t.n : '—') + '</dd>' +
        '<dt>' + L('Profesional', 'Dentist') + '</dt><dd>' + (S.step > 0 || S.p ? PROS[pro].n : '—') + '</dd>' +
        '<dt>' + L('Cuándo', 'When') + '</dt><dd>' + when + '</dd>' +
        '<dt>' + L('Duración', 'Duration') + '</dt><dd>' + (t ? t.min + ' min' : '—') + '</dd></dl>' +
        '<div class="total"><span>' + L('A pagar en clínica', 'Pay at the clinic') + '</span><span>' + (t ? (t.p ? money(t.p) : L('Gratis', 'Free')) : '—') + '</span></div>' +
        '<p class="ds-hint" style="margin-top:12px">' + L('Cancelación gratis hasta 12 horas antes.', 'Free cancellation up to 12 hours before.') + '</p></div>' +
        '<div style="margin-top:22px"><h3 class="ds-step-h" style="font-size:1rem">' + L('Mis citas', 'My appointments') + ' (' + list.length + ')</h3>' +
        (list.length ? '<ul class="ds-list">' + list.map(function (c, i) {
          return '<li><span><strong>' + esc(c.treat) + '</strong><br><span class="ds-muted">' + esc(c.when) + ' · ' + esc(c.code) + '</span></span><button class="ds-btn ds-btn--ghost ds-btn--sm" type="button" data-act="cancel" data-v="' + i + '">' + L('Cancelar', 'Cancel') + '</button></li>';
        }).join('') + '</ul>' : '<p class="ds-hint">' + L('Aquí aparecen las citas que reserves, guardadas en este navegador.', 'Appointments you book appear here, saved in this browser.') + '</p>') + '</div>';
    }

    function drawMain() {
      if (S.done) {
        main.innerHTML = '<div class="ds-done"><div class="ds-okmark" aria-hidden="true">✓</div><h3 class="ds-step-h">' + L('¡Listo, ', 'All set, ') + esc(S.name.trim().split(/\s+/)[0]) + '!</h3>' +
          '<p>' + esc(S.done.treat) + ' · ' + esc(S.done.pro) + '<br><strong>' + esc(S.done.when) + '</strong></p>' +
          '<span class="code">' + S.done.code + '</span>' +
          '<p class="ds-muted" style="margin-top:14px">' + L('Te enviamos la confirmación por WhatsApp al ', 'We sent the confirmation by WhatsApp to ') + esc(S.phone) + L('. Llega 10 minutos antes con tu documento.', '. Please arrive 10 minutes early with your ID.') + '</p>' +
          '<div class="ds-nav-row"><button class="ds-btn ds-btn--ghost" type="button" data-act="again">' + L('Reservar otra cita', 'Book another') + '</button><a class="ds-btn ds-btn--wa" href="#" data-ext="wa">WhatsApp</a></div></div>';
        return;
      }
      var html = DS.progress(STEPS, S.step), t = T();
      if (S.step === 0) {
        html += '<h3 class="ds-step-h">' + L('¿Qué necesitas?', 'What do you need?') + '</h3><div class="ds-choices">' + TREAT.map(function (x, i) {
          return '<button class="ds-choice" type="button" data-act="treat" data-v="' + i + '" aria-pressed="' + (S.t === i) + '"><span class="ds-check">✓</span><span class="txt"><strong>' + x.n + '</strong><small>' + x.d + ' · ' + x.min + ' min</small></span><span class="p">' + (x.p ? money(x.p) : L('Gratis', 'Free')) + '</span></button>';
        }).join('') + '</div>';
      } else if (S.step === 1) {
        html += '<h3 class="ds-step-h">' + L('¿Con quién?', 'With whom?') + '</h3><div class="ds-choices ds-choices--2">' + PROS.map(function (p, i) {
          return '<button class="ds-choice" type="button" data-act="pro" data-v="' + i + '" aria-pressed="' + (S.p === i) + '"><span class="ds-avatar">' + p.ini + '</span><span class="txt"><strong>' + p.n + '</strong><small>' + p.d + '</small></span></button>';
        }).join('') + '</div>';
      } else if (S.step === 2) {
        var sl = slotsFor(DAYS[S.d]), free = 0;
        var slots = sl.map(function (x) {
          var ok = freePro(DAYS[S.d], x, S.p) > 0; if (ok) free++;
          return '<button class="ds-slot" type="button" data-act="slot" data-v="' + x + '" aria-pressed="' + (S.s === x) + '"' + (ok ? '' : ' disabled aria-label="' + DS.hm(x, l) + ' ' + L('ocupado', 'taken') + '"') + '>' + DS.hm(x, l) + '</button>';
        }).join('');
        html += '<h3 class="ds-step-h">' + L('¿Cuándo te viene bien?', 'When suits you?') + '</h3>' + DS.daysStrip(DAYS, S.d, l, 'day') +
          '<p class="ds-hint" style="margin-top:14px">' + DS.dayLong(DAYS[S.d], l) + ' · ' + free + L(' horarios libres', ' free slots') + ' · ' + L('mañana 8–12 · tarde 2–6', 'morning 8–12 · afternoon 2–6') + '</p>' +
          '<div class="ds-slots">' + slots + '</div>' + (free ? '' : '<p class="ds-hint" style="margin-top:12px">' + L('Sin huecos este día. Prueba otro día o “primer profesional disponible”.', 'No slots this day. Try another day or “first available”.') + '</p>');
      } else {
        html += '<h3 class="ds-step-h">' + L('Tus datos', 'Your details') + '</h3><div class="ds-form ds-form--2">' +
          DS.field('dxName', L('Nombre completo', 'Full name'), { auto: 'name', value: S.name }) +
          DS.field('dxPhone', L('Celular (WhatsApp)', 'Mobile (WhatsApp)'), { type: 'tel', auto: 'tel', mode: 'tel', ph: '300 123 4567', value: S.phone }) +
          DS.field('dxEmail', L('Correo (opcional)', 'Email (optional)'), { type: 'email', auto: 'email', value: S.email, full: true }) +
          DS.field('dxNote', L('¿Algo que debamos saber? (opcional)', 'Anything we should know? (optional)'), { textarea: true, full: true, value: S.note, ph: L('Sensibilidad, alergias, miedo al odontólogo…', 'Sensitivity, allergies, dental anxiety…') }) +
          '<label class="full ds-small" style="display:flex;gap:10px;align-items:flex-start"><input type="checkbox" id="dxFirst"' + (S.first ? ' checked' : '') + '> ' + L('Es mi primera visita a Aurora', 'This is my first visit to Aurora') + '</label>' +
          '<label class="full ds-small" style="display:flex;gap:10px;align-items:flex-start"><input type="checkbox" id="dxConsent"' + (S.consent ? ' checked' : '') + '> <span>' + L('Autorizo el tratamiento de mis datos para gestionar la cita (Ley 1581 de 2012).', 'I authorise the use of my data to manage the appointment (Law 1581 of 2012).') + ' <span class="ds-err" id="dxConsent-e"></span></span></label></div>';
      }
      var canNext = (S.step === 0 && S.t !== null) || S.step === 1 || (S.step === 2 && S.s);
      html += '<div class="ds-nav-row">' + (S.step > 0 ? '<button class="ds-btn ds-btn--ghost" type="button" data-act="back">← ' + L('Atrás', 'Back') + '</button>' : '<span></span>') +
        (S.step < 3 ? '<button class="ds-btn" type="button" data-act="next"' + (canNext ? '' : ' disabled') + '>' + L('Continuar', 'Continue') + ' →</button>'
                    : '<button class="ds-btn" type="button" data-act="confirm">' + L('Confirmar cita', 'Confirm appointment') + '</button>') + '</div>';
      main.innerHTML = html;
    }
    function draw() { drawMain(); drawSide(); }

    function validate() {
      var bad = false;
      function chk(id, cond, msg) { DS.setErr(main, id, cond ? '' : msg); if (!cond) bad = true; }
      chk('dxName', DS.ok.name(S.name), L('Escribe tu nombre y apellido.', 'Enter your first and last name.'));
      chk('dxPhone', DS.ok.phone(S.phone), L('Usa un celular colombiano de 10 dígitos (empieza por 3) o un número con +.', 'Use a 10-digit Colombian mobile (starts with 3) or a number with +.'));
      chk('dxEmail', DS.ok.email(S.email), L('Revisa el correo o déjalo vacío.', 'Check the email or leave it empty.'));
      var ce = main.querySelector('#dxConsent-e'); ce.textContent = S.consent ? '' : L(' Necesitamos tu autorización.', ' We need your consent.'); if (!S.consent) bad = true;
      if (bad) { var first = main.querySelector('[aria-invalid="true"]'); if (first) first.focus(); }
      return !bad;
    }

    DS.actions(root, function (act, v) {
      var i;
      if (act === 'treat') { if ((i = DS.idx(v, TREAT.length)) === null) return; S.t = i; return draw(); }
      if (act === 'pro') { if ((i = DS.idx(v, PROS.length)) === null) return; S.p = i; S.s = null; return draw(); }
      if (act === 'day') { if ((i = DS.idx(v, DAYS.length)) === null) return; S.d = i; S.s = null; return draw(); }
      if (act === 'slot') { if (slotsFor(DAYS[S.d]).indexOf(v) === -1 || freePro(DAYS[S.d], v, S.p) < 0) return; S.s = v; return draw(); }
      if (act === 'next') {
        if (S.done || S.step >= 3 || (S.step === 0 && S.t === null) || (S.step === 2 && !S.s)) return;
        S.step++; draw();
        var h = main.querySelector('.ds-step-h'); if (h) { h.setAttribute('tabindex', '-1'); h.focus(); }
        return;
      }
      if (act === 'back') { if (S.done || S.step <= 0) return; S.step--; return draw(); }
      if (act === 'confirm') {
        if (S.done || S.step !== 3 || !T() || !S.s) return;
        if (!validate()) return;
        var who = freePro(DAYS[S.d], S.s, S.p), t = T();
        S.done = { code: DS.code('AUR'), treat: t.n, pro: PROS[who > 0 ? who : 1].n, when: DS.dayLong(DAYS[S.d], l) + ' · ' + DS.hm(S.s, l) };
        var list = mine(); list.unshift(S.done); db.set('citas', list.slice(0, 6));
        DS.toast(root, L('Cita confirmada · ', 'Appointment confirmed · ') + S.done.code);
        return draw();
      }
      if (act === 'again') { S = { step: 0, t: null, p: 0, d: 0, s: null, name: S.name, phone: S.phone, email: S.email, first: false, note: '', consent: S.consent, done: null }; return draw(); }
      if (act === 'cancel') {
        var ls = mine(); if ((i = DS.idx(v, ls.length)) === null) return;
        var c = ls.splice(i, 1)[0]; db.set('citas', ls);
        DS.toast(root, L('Cita cancelada · ', 'Appointment cancelled · ') + (c && c.code ? c.code : ''));
        return drawSide();
      }
    });
    root.addEventListener('input', function (e) {
      var id = e.target.id;
      if (id === 'dxName') S.name = e.target.value;
      if (id === 'dxPhone') S.phone = e.target.value;
      if (id === 'dxEmail') S.email = e.target.value;
      if (id === 'dxNote') S.note = e.target.value;
      if (id === 'dxFirst') S.first = e.target.checked;
      if (id === 'dxConsent') S.consent = e.target.checked;
      if (/^dx(Name|Phone|Email)$/.test(id) && e.target.getAttribute('aria-invalid') === 'true') DS.setErr(main, id, '');
    });
    root.addEventListener('change', function (e) { if (e.target.id === 'dxFirst') S.first = e.target.checked; if (e.target.id === 'dxConsent') S.consent = e.target.checked; });

    var tick = setInterval(function () { var st = root.querySelector('[data-status]'), s = DS.status(HOURS, l); if (st) st.innerHTML = '<span class="ds-dot' + (s.open ? '' : ' ds-dot--off') + '"></span><span>' + s.text + '</span>'; }, 60000);
    draw();
    return function () { clearInterval(tick); };
  }
};
</script>
