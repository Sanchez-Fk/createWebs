
<script>
/* ===========================================================================
   DEMO 02 · TRATTORIA NOVE — carta con pedido a domicilio y reserva de mesa
   =========================================================================== */
DEMOS.restaurante = {
  mount: function (root, l) {
    var L = DS.lang(l), money = DS.money, esc = DS.esc;
    var db = DS.store('trattoria');

    var CATS = [['antipasti', 'Antipasti'], ['pasta', 'Pasta'], ['pizza', 'Pizza'], ['dolci', 'Dolci'], ['bebidas', L('Bebidas', 'Drinks')]];
    var V = 'veg', G = 'gf', H = 'hot';
    var MENU = [
      { id: 'burr', c: 'antipasti', img: 'dishAntipasto', n: 'Burrata e pomodoro', d: L('Burrata fresca, tomate de huerta, albahaca y aceite de oliva', 'Fresh burrata, garden tomato, basil, olive oil'), p: 38000, t: [V, G] },
      { id: 'brus', c: 'antipasti', n: 'Bruschetta classica', d: L('Pan de masa madre, tomate, ajo y orégano', 'Sourdough, tomato, garlic, oregano'), p: 22000, t: [V] },
      { id: 'carp', c: 'antipasti', n: 'Carpaccio di manzo', d: L('Res en láminas, rúgula, parmesano y alcaparras', 'Thin beef, rocket, parmesan, capers'), p: 36000, t: [G] },
      { id: 'spag', c: 'pasta', img: 'dishSpaghetti', n: 'Spaghetti al pomodoro', d: L('Salsa de tomate cocida seis horas, parmesano', 'Six-hour tomato sauce, parmesan'), p: 42000, t: [V] },
      { id: 'trof', c: 'pasta', img: 'dishPesto', n: 'Trofie al pesto', d: L('Pesto genovés, piñones y tomate cherry', 'Genovese pesto, pine nuts, cherry tomatoes'), p: 46000, t: [V] },
      { id: 'carb', c: 'pasta', n: 'Carbonara', d: L('Guanciale, yema, pecorino y pimienta negra', 'Guanciale, egg yolk, pecorino, black pepper'), p: 48000, t: [] },
      { id: 'arra', c: 'pasta', n: 'Rigatoni all’arrabbiata', d: L('Tomate, ajo y ají de la casa', 'Tomato, garlic, house chilli'), p: 44000, t: [V, H] },
      { id: 'marg', c: 'pizza', img: 'dishPizza', n: 'Margherita', d: L('Tomate San Marzano, mozzarella y romero', 'San Marzano tomato, mozzarella, rosemary'), p: 44000, t: [V] },
      { id: 'diav', c: 'pizza', n: 'Diavola', d: L('Salami picante, mozzarella y miel de ají', 'Spicy salami, mozzarella, chilli honey'), p: 49000, t: [H] },
      { id: 'quat', c: 'pizza', n: 'Quattro formaggi', d: L('Mozzarella, gorgonzola, parmesano y fontina', 'Mozzarella, gorgonzola, parmesan, fontina'), p: 52000, t: [V] },
      { id: 'tira', c: 'dolci', img: 'dishTiramisu', n: 'Tiramisù', d: L('Mascarpone, café de Jardín y cacao', 'Mascarpone, Jardín coffee, cocoa'), p: 24000, t: [V] },
      { id: 'panc', c: 'dolci', n: 'Panna cotta', d: L('Vainilla y coulis de frutos rojos', 'Vanilla, red berry coulis'), p: 21000, t: [V, G] },
      { id: 'limo', c: 'bebidas', n: L('Limonada de hierbabuena', 'Mint lemonade'), d: L('Natural, 400 ml', 'Fresh, 400 ml'), p: 12000, t: [V, G] },
      { id: 'vino', c: 'bebidas', n: L('Vino de la casa', 'House wine'), d: L('Copa de tinto o blanco', 'Glass of red or white'), p: 26000, t: [V, G] },
      { id: 'agua', c: 'bebidas', n: L('Agua con gas', 'Sparkling water'), d: '500 ml', p: 9000, t: [V, G] }
    ];
    var TAGS = {}; TAGS[V] = L('Vegetariano', 'Vegetarian'); TAGS[G] = L('Sin gluten', 'Gluten-free'); TAGS[H] = L('Picante', 'Spicy');
    var BY = {}; MENU.forEach(function (m) { BY[m.id] = m; });
    var FEE = 6000, FREE_FROM = 120000;
    var HOURS = [['12:00', '17:00'], null, ['12:00', '22:00'], ['12:00', '22:00'], ['12:00', '22:00'], ['12:00', '23:00'], ['12:00', '23:00']];
    var DAYS = DS.days(10, [1]);

    function cleanCart(c) {
      var out = {};
      c = DS.obj(c);
      Object.keys(c).forEach(function (k) { var n = parseInt(c[k], 10); if (DS.has(BY, k) && n > 0 && n < 100) out[k] = n; });
      return out;
    }

    var S = {
      cat: 'pasta', q: '', diet: '', cart: cleanCart(db.get('cart', {})), mode: 'dom', name: '', phone: '', addr: '', notes: '', order: null,
      people: 2, d: 0, time: null, zone: 'salon', occ: '', rname: '', rphone: '', res: null
    };

    root.className = 'dm ds ds-rest';
    root.innerHTML =
      DS.header({ brand: 'Trattoria Nove', mark: 'N', ctaTo: 'reservar', cta: L('Reservar', 'Book'), nav: [['carta', L('Carta y pedido', 'Menu & order')], ['reservar', L('Reservar mesa', 'Book a table')], ['galeria', L('Galería', 'Gallery')], ['ubicacion', L('Ubicación', 'Location')]] }) +

      '<section class="ds-cover"><div class="ds-cover__img" style="position:relative">' + DS.photo('restHero', L('Mesa servida con copas de vino y platos', 'Table set with wine glasses and dishes')) + '</div>' +
        '<div class="ds-cover__panel"><span class="ds-eyebrow">' + L('Cocina italiana de barrio · Laureles', 'Neighbourhood Italian · Laureles') + '</span>' +
        '<h1 class="ds-h1" style="margin-top:12px">' + L('Pasta fresca, todos los días.', 'Fresh pasta, every day.') + '</h1>' +
        '<p class="ds-lede">' + L('Pide a domicilio o para recoger en tres toques, o reserva tu mesa sin llamar.', 'Order delivery or pickup in three taps, or book a table without calling.') + '</p>' +
        '<div class="ds-actions"><a class="ds-btn" href="#ds-carta" data-go="carta">' + L('Pedir ahora', 'Order now') + '</a><a class="ds-btn ds-btn--ghost" href="#ds-reservar" data-go="reservar">' + L('Reservar mesa', 'Book a table') + '</a></div>' +
        '<div class="ds-status" data-status style="margin:18px 0 0"></div></div></section>' +

      '<div style="height:clamp(24px,4cqi,56px)"></div>' +
      DS.section('carta', L('Carta', 'Menu'), L('Elige, ajusta y pide.', 'Pick, adjust and order.'),
        L('Domicilio en Laureles, Estadio y Conquistadores. Gratis desde ', 'Delivery in Laureles, Estadio and Conquistadores. Free from ') + money(FREE_FROM) + '.',
        '<div class="ds-book"><div class="ds-book__main"><div class="ds-tabs" role="tablist" id="rtTabs"></div>' +
          '<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center"><input class="ds-search" id="rtQ" type="search" placeholder="' + L('Buscar plato…', 'Search dishes…') + '" aria-label="' + L('Buscar plato', 'Search dishes') + '" style="flex:1;min-width:180px">' +
          '<div class="ds-seg" role="group" aria-label="' + L('Filtro', 'Filter') + '" id="rtDiet"></div></div>' +
          '<div class="ds-menu" id="rtMenu"></div></div>' +
        '<aside class="ds-book__side" id="rtOrder"></aside></div>', false) +

      DS.section('reservar', L('Reservas', 'Reservations'), L('Tu mesa, sin llamar.', 'Your table, no phone call.'),
        L('Confirmamos por WhatsApp. Grupos de más de 10, escríbenos directamente.', 'We confirm by WhatsApp. Groups over 10, message us directly.'),
        '<div class="ds-book"><div class="ds-book__main" id="rsMain"></div><aside class="ds-book__side" id="rsSide"></aside></div>', true) +

      DS.section('galeria', L('Galería', 'Gallery'), L('Así sale de la cocina.', 'Straight from the kitchen.'), '',
        DS.gallery([['restHero', L('El salón', 'The dining room'), L('Mesa servida', 'Set table')], ['dishPizza', 'Margherita', 'Pizza margherita'], ['dishSpaghetti', 'Pomodoro', 'Spaghetti'], ['dishPesto', 'Pesto', 'Trofie al pesto'], ['dishAntipasto', 'Burrata', 'Burrata'], ['dishTiramisu', 'Tiramisù', 'Tiramisù']]), false) +

      DS.section('opiniones', L('Opiniones', 'Reviews'), L('Vuelven por la pasta.', 'They come back for the pasta.'), L('Reseñas de ejemplo para esta demo.', 'Sample reviews for this demo.'),
        DS.reviews([
          [5, L('El pedido llegó en 35 minutos y la pasta seguía al dente. El tiramisú, de otro nivel.', 'The order arrived in 35 minutes and the pasta was still al dente. The tiramisu is on another level.'), 'Daniela', 'Laureles'],
          [5, L('Reservé la terraza para un cumpleaños desde el celular y nos tenían la mesa decorada.', 'I booked the terrace for a birthday from my phone and they had the table decorated.'), 'Santiago', 'Estadio'],
          [4, L('Por fin una carta con precios claros y opciones sin gluten marcadas.', 'Finally a menu with clear prices and gluten-free options marked.'), 'Laura', 'Conquistadores']
        ]), true) +

      DS.section('ubicacion', L('Horario y ubicación', 'Hours & location'), L('En el corazón de Laureles.', 'In the heart of Laureles.'), '',
        DS.visit({ hours: HOURS, address: 'Circular 73B #39B-40', area: 'Laureles, Medellín', note: L('Cocina abierta hasta 30 minutos antes del cierre. Lunes descansamos.', 'Kitchen open until 30 minutes before closing. Closed on Mondays.') }, l), false) +

      DS.section('faq', L('Preguntas frecuentes', 'FAQ'), L('Antes de pedir.', 'Before you order.'), '',
        DS.faq([
          [L('¿Hasta dónde llega el domicilio?', 'Where do you deliver?'), L('Laureles, Estadio, Conquistadores y Suramericana. Domicilio de $6.000, gratis en pedidos desde $120.000.', 'Laureles, Estadio, Conquistadores and Suramericana. $6,000 delivery, free on orders from $120,000.')],
          [L('¿Tienen opciones sin gluten?', 'Do you have gluten-free options?'), L('Sí, marcadas en la carta. La pasta sin gluten se prepara en una olla aparte; avísanos si es por celiaquía.', 'Yes, marked on the menu. Gluten-free pasta is cooked in a separate pot; tell us if it is for coeliac disease.')],
          [L('¿Se admiten mascotas?', 'Are pets allowed?'), L('En la terraza, con gusto. Hay agua para ellas.', 'On the terrace, gladly. We have water for them.')],
          [L('¿Cobran servicio?', 'Is there a service charge?'), L('El servicio voluntario del 10 % se sugiere solo en mesa, nunca en domicilios.', 'The voluntary 10% service is suggested only for dine-in, never for delivery.')]
        ]), true) +

      DS.footer({ brand: 'Trattoria Nove', mark: 'N', tagline: L('Pasta fresca y horno de piedra en Laureles desde 2019.', 'Fresh pasta and stone oven in Laureles since 2019.'),
        cols: [[L('Restaurante', 'Restaurant'), [[L('Carta', 'Menu'), 'carta'], [L('Reservas', 'Reservations'), 'reservar'], [L('Galería', 'Gallery'), 'galeria']]],
               [L('Contacto', 'Contact'), [['WhatsApp', null, 'wa'], ['@trattorianove', null, 'ig'], ['hola@nove.demo', null, 'mail']]],
               [L('Legal', 'Legal'), [[L('Tratamiento de datos', 'Data policy'), null], [L('Alérgenos', 'Allergens'), null]]]] }, l);

    DS.chrome(root, l);
    var tabs = root.querySelector('#rtTabs'), menuEl = root.querySelector('#rtMenu'), dietEl = root.querySelector('#rtDiet'), orderEl = root.querySelector('#rtOrder'),
        rsMain = root.querySelector('#rsMain'), rsSide = root.querySelector('#rsSide');

    function qty() { return Object.keys(S.cart).reduce(function (a, k) { return a + S.cart[k]; }, 0); }
    function subtotal() { return Object.keys(S.cart).reduce(function (a, k) { return a + (BY[k] ? BY[k].p * S.cart[k] : 0); }, 0); }
    function fee() { return S.mode === 'dom' && subtotal() < FREE_FROM && qty() ? FEE : 0; }
    function save() { db.set('cart', S.cart); }
    function status() { var st = DS.status(HOURS, l), el = root.querySelector('[data-status]'); if (el) el.innerHTML = '<span class="ds-dot' + (st.open ? '' : ' ds-dot--off') + '"></span><span>' + st.text + '</span>'; }

    function dishCtl(m) {
      var n = S.cart[m.id] || 0;
      return '<span class="ds-mono">' + money(m.p) + '</span>' +
        (n ? '<span class="ds-qty"><button type="button" data-act="dec" data-v="' + m.id + '" aria-label="' + L('Quitar uno de ', 'Remove one ') + esc(m.n) + '">−</button><span>' + n + '</span><button type="button" data-act="inc" data-v="' + m.id + '" aria-label="' + L('Añadir otro ', 'Add another ') + esc(m.n) + '">+</button></span>'
           : '<button class="ds-btn ds-btn--sm" type="button" data-act="inc" data-v="' + m.id + '">' + L('Añadir', 'Add') + '</button>');
    }
    /* al añadir o quitar solo cambia el control de ese plato: las fotos no se vuelven a dibujar */
    function refreshDish(id) {
      var row = menuEl.querySelector('[data-dish="' + id + '"] .ds-dish__row');
      if (row) row.innerHTML = dishCtl(BY[id]); else drawMenu();
    }
    function drawMenu() {
      tabs.innerHTML = CATS.map(function (c) { return '<button class="ds-tab" type="button" role="tab" data-act="cat" data-v="' + c[0] + '" aria-selected="' + (S.cat === c[0] && !S.q) + '">' + c[1] + '</button>'; }).join('');
      dietEl.innerHTML = [['', L('Todo', 'All')], [V, TAGS[V]], [G, TAGS[G]]].map(function (d) { return '<button type="button" data-act="diet" data-v="' + d[0] + '" aria-pressed="' + (S.diet === d[0]) + '">' + d[1] + '</button>'; }).join('');
      var q = S.q.trim().toLowerCase();
      var list = MENU.filter(function (m) {
        if (q) return (m.n + ' ' + m.d).toLowerCase().indexOf(q) !== -1 && (!S.diet || m.t.indexOf(S.diet) !== -1);
        return m.c === S.cat && (!S.diet || m.t.indexOf(S.diet) !== -1);
      });
      menuEl.innerHTML = list.length ? list.map(function (m) {
        return '<article class="ds-dish" data-dish="' + m.id + '"><div class="pic">' + (m.img && IMG[m.img] ? '<img src="' + IMG[m.img] + '" alt="' + esc(m.n) + '" decoding="async">' : '<span aria-hidden="true">' + m.n.charAt(0) + '</span>') + '</div>' +
          '<div><h4>' + m.n + '</h4><p>' + m.d + '</p><div>' + m.t.map(function (t) { return '<span class="ds-tag">' + TAGS[t] + '</span>'; }).join('') + '</div>' +
          '<div class="ds-dish__row">' + dishCtl(m) + '</div></div></article>';
      }).join('') : '<p class="ds-hint">' + L('No hay platos con ese filtro.', 'No dishes match that filter.') + '</p>';
    }

    function drawOrder() {
      if (S.order) {
        orderEl.innerHTML = '<div class="ds-done"><div class="ds-okmark" aria-hidden="true">✓</div><h3 class="ds-step-h">' + L('Pedido enviado', 'Order sent') + '</h3>' +
          '<span class="code">' + S.order.code + '</span><p class="ds-muted" style="margin-top:12px">' + (S.order.mode === 'dom' ? L('Llega en 35–45 minutos.', 'Arrives in 35–45 minutes.') : L('Listo para recoger en 20 minutos.', 'Ready for pickup in 20 minutes.')) + '</p>' +
          '<p class="ds-hint" style="margin-top:14px">' + L('Mensaje que recibe el restaurante por WhatsApp:', 'Message the restaurant receives on WhatsApp:') + '</p><pre class="ds-msg">' + esc(S.order.msg) + '</pre>' +
          '<button class="ds-btn ds-btn--ghost ds-btn--block" style="margin-top:14px" type="button" data-act="neworder">' + L('Hacer otro pedido', 'Place another order') + '</button></div>';
        return;
      }
      var keys = Object.keys(S.cart).filter(function (k) { return BY[k]; }), sub = subtotal(), f = fee(), missing = FREE_FROM - sub;
      orderEl.innerHTML = '<h3 class="ds-step-h" style="font-size:1.1rem">' + L('Tu pedido', 'Your order') + (qty() ? ' · ' + qty() : '') + '</h3>' +
        '<div class="ds-seg" role="group" aria-label="' + L('Entrega', 'Fulfilment') + '"><button type="button" data-act="mode" data-v="dom" aria-pressed="' + (S.mode === 'dom') + '">' + L('Domicilio', 'Delivery') + '</button><button type="button" data-act="mode" data-v="rec" aria-pressed="' + (S.mode === 'rec') + '">' + L('Recoger', 'Pickup') + '</button></div>' +
        (keys.length ? '<ul class="ds-list">' + keys.map(function (k) {
          return '<li><span>' + S.cart[k] + '× ' + BY[k].n + '</span><span class="ds-mono">' + money(BY[k].p * S.cart[k]) + '</span></li>';
        }).join('') + '</ul>' +
          '<div class="ds-sum" style="margin-top:10px"><dl><dt>Subtotal</dt><dd class="ds-mono">' + money(sub) + '</dd>' +
          (S.mode === 'dom' ? '<dt>' + L('Domicilio', 'Delivery') + '</dt><dd class="ds-mono">' + (f ? money(f) : L('Gratis', 'Free')) + '</dd>' : '') + '</dl>' +
          (S.mode === 'dom' && missing > 0 ? '<p class="ds-hint" style="margin-top:8px">' + L('Te faltan ', 'Add ') + money(missing) + L(' para domicilio gratis.', ' more for free delivery.') + '</p>' : '') +
          '<div class="total"><span>Total</span><span>' + money(sub + f) + '</span></div></div>' +
          '<div class="ds-form" style="margin-top:16px">' +
            DS.field('rtName', L('Nombre', 'Name'), { auto: 'name', value: S.name }) +
            DS.field('rtPhone', L('Celular', 'Mobile'), { type: 'tel', auto: 'tel', mode: 'tel', ph: '300 123 4567', value: S.phone }) +
            (S.mode === 'dom' ? DS.field('rtAddr', L('Dirección y barrio', 'Address and neighbourhood'), { auto: 'street-address', ph: L('Cq. 74 #40-10, Laureles', 'Cq. 74 #40-10, Laureles'), value: S.addr }) : '') +
            DS.field('rtNotes', L('Notas (opcional)', 'Notes (optional)'), { value: S.notes, ph: L('Sin cebolla, timbre dañado…', 'No onion, broken doorbell…') }) +
          '</div><button class="ds-btn ds-btn--wa ds-btn--block" style="margin-top:16px" type="button" data-act="checkout">' + DS.WA_ICON.replace('<svg', '<svg width="18" height="18"') + ' ' + L('Enviar pedido por WhatsApp', 'Send order on WhatsApp') + '</button>'
        : '<p class="ds-hint" style="margin-top:14px">' + L('Añade platos desde la carta. Tu pedido se guarda aunque recargues.', 'Add dishes from the menu. Your order is kept even if you reload.') + '</p>');
    }

    function slotsR() { return DS.range('12:00', '15:00', 30).concat(DS.range('18:30', '22:00', 30)); }
    function fullR(t) { return DS.past(DAYS[S.d], t, 45) || DS.seeded(DAYS[S.d].getDate() * 3 + S.people, DS.minutes(t) / 30) < (S.zone === 'terraza' ? 0.45 : 0.28); }
    function drawRes() {
      if (S.res) {
        rsMain.innerHTML = '<div class="ds-done"><div class="ds-okmark" aria-hidden="true">✓</div><h3 class="ds-step-h">' + L('Mesa reservada', 'Table booked') + '</h3><p><strong>' + esc(S.res.when) + '</strong><br>' + esc(S.res.detail) + '</p><span class="code">' + S.res.code + '</span>' +
          '<p class="ds-hint" style="margin-top:14px">' + L('Mensaje de confirmación:', 'Confirmation message:') + '</p><pre class="ds-msg">' + esc(S.res.msg) + '</pre>' +
          '<div class="ds-nav-row"><button class="ds-btn ds-btn--ghost" type="button" data-act="newres">' + L('Hacer otra reserva', 'Make another booking') + '</button></div></div>';
        rsSide.innerHTML = '<p class="ds-hint">' + L('Guardamos la mesa 15 minutos. Si llegas tarde, avísanos por WhatsApp.', 'We hold the table for 15 minutes. Running late? Message us on WhatsApp.') + '</p>';
        return;
      }
      rsMain.innerHTML =
        '<h3 class="ds-step-h">' + L('¿Cuántos son?', 'How many?') + '</h3><span class="ds-qty"><button type="button" data-act="pp" data-v="-1" aria-label="' + L('Menos personas', 'Fewer people') + '">−</button><span style="min-width:44px">' + S.people + '</span><button type="button" data-act="pp" data-v="1" aria-label="' + L('Más personas', 'More people') + '">+</button></span>' +
        '<h3 class="ds-step-h" style="margin-top:22px">' + L('Día', 'Day') + '</h3>' + DS.daysStrip(DAYS, S.d, l, 'rday') +
        '<h3 class="ds-step-h" style="margin-top:22px">' + L('Zona y hora', 'Area & time') + '</h3><div class="ds-seg" role="group"><button type="button" data-act="zone" data-v="salon" aria-pressed="' + (S.zone === 'salon') + '">' + L('Salón', 'Indoors') + '</button><button type="button" data-act="zone" data-v="terraza" aria-pressed="' + (S.zone === 'terraza') + '">' + L('Terraza', 'Terrace') + '</button></div>' +
        '<div class="ds-slots">' + slotsR().map(function (t) { var full = fullR(t); return '<button class="ds-slot" type="button" data-act="rtime" data-v="' + t + '" aria-pressed="' + (S.time === t && !full) + '"' + (full ? ' disabled aria-label="' + DS.hm(t, l) + ' ' + L('sin mesas', 'fully booked') + '"' : '') + '>' + DS.hm(t, l) + '</button>'; }).join('') + '</div>' +
        '<div class="ds-legend"><span>' + L('Tachado: sin mesas', 'Struck through: fully booked') + '</span><span>' + L('Almuerzo 12–3 · Cena 6:30–10', 'Lunch 12–3 · Dinner 6:30–10') + '</span></div>';
      var t = S.time && !fullR(S.time) ? S.time : null;
      rsSide.innerHTML = '<div class="ds-sum"><dl><dt>' + L('Personas', 'People') + '</dt><dd>' + S.people + '</dd><dt>' + L('Día', 'Day') + '</dt><dd>' + DS.dayLong(DAYS[S.d], l) + '</dd><dt>' + L('Hora', 'Time') + '</dt><dd>' + (t ? DS.hm(t, l) : '—') + '</dd><dt>' + L('Zona', 'Area') + '</dt><dd>' + (S.zone === 'salon' ? L('Salón', 'Indoors') : L('Terraza', 'Terrace')) + '</dd></dl></div>' +
        '<div class="ds-form" style="margin-top:16px">' +
          '<div class="ds-field"><label for="rsOcc">' + L('Ocasión (opcional)', 'Occasion (optional)') + '</label><select id="rsOcc"><option value="">' + L('Ninguna', 'None') + '</option><option value="cumple"' + (S.occ === 'cumple' ? ' selected' : '') + '>' + L('Cumpleaños', 'Birthday') + '</option><option value="aniv"' + (S.occ === 'aniv' ? ' selected' : '') + '>' + L('Aniversario', 'Anniversary') + '</option><option value="neg"' + (S.occ === 'neg' ? ' selected' : '') + '>' + L('Comida de negocios', 'Business meal') + '</option></select></div>' +
          DS.field('rsName', L('Nombre', 'Name'), { auto: 'name', value: S.rname }) +
          DS.field('rsPhone', L('Celular', 'Mobile'), { type: 'tel', auto: 'tel', mode: 'tel', ph: '300 123 4567', value: S.rphone }) +
        '</div><button class="ds-btn ds-btn--block" style="margin-top:16px" type="button" data-act="reserve"' + (t ? '' : ' disabled') + '>' + (t ? L('Reservar mesa', 'Book table') : L('Elige una hora', 'Pick a time')) + '</button>';
    }

    function need(el, id, cond, msg) { DS.setErr(el, id, cond ? '' : msg); return cond; }

    DS.actions(root, function (act, v) {
      var i;
      if (act === 'cat') { if (!CATS.some(function (c) { return c[0] === v; })) return; S.cat = v; S.q = ''; var qi = root.querySelector('#rtQ'); if (qi) qi.value = ''; return drawMenu(); }
      if (act === 'diet') { var dv = v == null ? '' : v; if (['', V, G].indexOf(dv) === -1) return; S.diet = dv; return drawMenu(); }
      if (act === 'inc') { if (!DS.has(BY, v) || (S.cart[v] || 0) >= 99) return; S.cart[v] = (S.cart[v] || 0) + 1; save(); DS.toast(root, BY[v].n + L(' añadido · ', ' added · ') + qty() + L(' en el pedido', ' in order')); refreshDish(v); return drawOrder(); }
      if (act === 'dec') { if (!DS.has(BY, v) || !S.cart[v]) return; S.cart[v]--; if (S.cart[v] <= 0) delete S.cart[v]; save(); refreshDish(v); return drawOrder(); }
      if (act === 'mode') { if (v !== 'dom' && v !== 'rec') return; S.mode = v; return drawOrder(); }
      if (act === 'checkout') {
        if (S.order || !qty()) return;
        var okN = need(orderEl, 'rtName', DS.ok.name(S.name), L('Escribe tu nombre.', 'Enter your name.'));
        var okP = need(orderEl, 'rtPhone', DS.ok.phone(S.phone), L('Celular de 10 dígitos que empiece por 3.', '10-digit mobile starting with 3.'));
        var okA = S.mode !== 'dom' || need(orderEl, 'rtAddr', S.addr.trim().length >= 6, L('Necesitamos la dirección completa.', 'We need the full address.'));
        if (!(okN && okP && okA)) { var bad = orderEl.querySelector('[aria-invalid="true"]'); if (bad) bad.focus(); return; }
        var c = DS.code('TN'), sub = subtotal(), f = fee();
        var lines = Object.keys(S.cart).filter(function (k) { return DS.has(BY, k); }).map(function (k) { return S.cart[k] + '× ' + BY[k].n + ' — ' + money(BY[k].p * S.cart[k]); });
        var msg = L('Hola Trattoria Nove, este es mi pedido ', 'Hi Trattoria Nove, here is my order ') + c + ' · ' + (S.mode === 'dom' ? L('Domicilio', 'Delivery') : L('Recoger', 'Pickup')) + '\n\n' + lines.join('\n') +
          '\n\nSubtotal: ' + money(sub) + (S.mode === 'dom' ? '\n' + L('Domicilio: ', 'Delivery: ') + (f ? money(f) : L('gratis', 'free')) : '') + '\nTotal: ' + money(sub + f) +
          '\n\n' + S.name.trim() + ' · ' + S.phone.trim() + (S.mode === 'dom' ? '\n' + S.addr.trim() : '') + (S.notes.trim() ? '\n' + L('Notas: ', 'Notes: ') + S.notes.trim() : '');
        S.order = { code: c, mode: S.mode, msg: msg }; S.cart = {}; save();
        DS.toast(root, L('Pedido ', 'Order ') + c + L(' enviado', ' sent'));
        drawMenu(); return drawOrder();
      }
      if (act === 'neworder') { S.order = null; return drawOrder(); }
      if (act === 'pp') { var dd = v === '1' ? 1 : v === '-1' ? -1 : 0; if (!dd) return; S.people = Math.max(1, Math.min(10, S.people + dd)); return drawRes(); }
      if (act === 'rday') { if ((i = DS.idx(v, DAYS.length)) === null) return; S.d = i; S.time = null; return drawRes(); }
      if (act === 'zone') { if (v !== 'salon' && v !== 'terraza') return; S.zone = v; return drawRes(); }
      if (act === 'rtime') { if (slotsR().indexOf(v) === -1 || fullR(v)) return; S.time = v; return drawRes(); }
      if (act === 'reserve') {
        if (S.res || !S.time || fullR(S.time)) return;
        var n1 = need(rsSide, 'rsName', DS.ok.name(S.rname), L('Escribe tu nombre.', 'Enter your name.'));
        var n2 = need(rsSide, 'rsPhone', DS.ok.phone(S.rphone), L('Celular de 10 dígitos que empiece por 3.', '10-digit mobile starting with 3.'));
        if (!(n1 && n2)) { var b2 = rsSide.querySelector('[aria-invalid="true"]'); if (b2) b2.focus(); return; }
        var OCC = { cumple: L('cumpleaños', 'birthday'), aniv: L('aniversario', 'anniversary'), neg: L('comida de negocios', 'business meal') };
        var occ = DS.has(OCC, S.occ) ? OCC[S.occ] : '';
        var when = DS.dayLong(DAYS[S.d], l) + ' · ' + DS.hm(S.time, l), zone = S.zone === 'salon' ? L('salón', 'indoors') : L('terraza', 'terrace');
        var rc = DS.code('TN');
        S.res = { code: rc, when: when, detail: S.people + ' ' + L(S.people === 1 ? 'persona' : 'personas', S.people === 1 ? 'person' : 'people') + ' · ' + zone + (occ ? ' · ' + occ : ''),
          msg: L('Hola ', 'Hi ') + S.rname.trim().split(/\s+/)[0] + L(', tu mesa está confirmada: ', ', your table is confirmed: ') + when + ', ' + S.people + ' ' + L('personas', 'people') + ', ' + zone + '.' + (occ ? L(' Tendremos todo listo para el ', ' We’ll have everything ready for the ') + occ + '.' : '') + L('\nCódigo: ', '\nCode: ') + rc + L('\nSi cambias de planes, responde a este mensaje.', '\nIf your plans change, just reply to this message.') };
        DS.toast(root, L('Mesa reservada · ', 'Table booked · ') + rc);
        return drawRes();
      }
      if (act === 'newres') { S.res = null; S.time = null; return drawRes(); }
    });
    root.addEventListener('input', function (e) {
      var id = e.target.id, v = e.target.value;
      if (id === 'rtQ') { S.q = v; drawMenu(); return; }
      if (id === 'rtName') S.name = v; if (id === 'rtPhone') S.phone = v; if (id === 'rtAddr') S.addr = v; if (id === 'rtNotes') S.notes = v;
      if (id === 'rsName') S.rname = v; if (id === 'rsPhone') S.rphone = v;
      if (e.target.getAttribute('aria-invalid') === 'true') DS.setErr(e.target.closest('aside,div'), id, '');
    });
    root.addEventListener('change', function (e) { if (e.target.id === 'rsOcc') S.occ = e.target.value; });

    status(); drawMenu(); drawOrder(); drawRes();
    var tick = setInterval(status, 60000);
    return function () { clearInterval(tick); };
  }
};
</script>
