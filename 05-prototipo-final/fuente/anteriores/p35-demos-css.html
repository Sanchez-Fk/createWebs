
<style>
/* ===========================================================================
   DEMOS INTERACTIVAS — cada oficio con su propia paleta.
   No heredan del sistema del portafolio (design.md: "esa separación es
   intencional"). Contrastes de texto verificados ≥ 4.5:1 en cada paleta.
   =========================================================================== */
.bw{ border:1px solid var(--line-hi); border-radius:var(--r); overflow:hidden; background:var(--s1); }
.bw-bar{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:6px 16px; padding:10px 14px; border-bottom:1px solid var(--line); font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--fg-2); }
.bw-bar b{ color:var(--fg); font-weight:500; letter-spacing:.04em; text-transform:none; }

.dm{ background:var(--d-bg); color:var(--d-fg); font-family:var(--sans); font-size:15px; line-height:1.55; }
.dm-dental{ --d-bg:#F3F8FB; --d-fg:#12293C; --d-muted:#5A7184; --d-line:#D3E0EA; --d-surf:#FFFFFF; --d-acc:#1F6FA8; --d-acc-ink:#FFFFFF; --d-rad:10px; --d-head:var(--sans); }
.dm-rest{ --d-bg:#15100D; --d-fg:#F0E4CE; --d-muted:#B7A58A; --d-line:#3A2B22; --d-surf:#1E1713; --d-acc:#A8431F; --d-acc-ink:#F6EADA; --d-acc-t:#E07A52; --d-rad:3px; --d-head:Georgia,'Times New Roman',serif; }
.dm-barber{ --d-bg:#E9E2D5; --d-fg:#141210; --d-muted:#6B6152; --d-line:#C9BFAE; --d-surf:#F3EEE5; --d-acc:#141210; --d-acc-ink:#E9E2D5; --d-acc-t:#7A5C24; --d-rad:0px; --d-head:var(--sans); }
.dm-gym{ --d-bg:#0B0B0B; --d-fg:#F2F2F2; --d-muted:#8C8C8C; --d-line:#242424; --d-surf:#141414; --d-acc:#C9FF2E; --d-acc-ink:#0B0B0B; --d-acc-t:#C9FF2E; --d-rad:2px; --d-head:var(--sans); }

.dm button{ font:inherit; color:inherit; cursor:pointer; }
.dm :focus-visible{ outline:2px solid var(--d-acc-t, var(--d-acc)); outline-offset:2px; }
.dm-pad{ padding:18px; }
.dm-top{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 18px; border-bottom:1px solid var(--d-line); }
.dm-logo{ display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:-.01em; font-family:var(--d-head); }
.dm-links{ display:none; gap:22px; font-size:13px; color:var(--d-muted); }
.dm-tag{ font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--d-muted); }

.dm-img{ position:relative; overflow:hidden; background:var(--d-surf); border-radius:var(--d-rad); }
.dm-img img{ display:block; width:100%; height:100%; object-fit:cover; }
.dm-img .noimg{ position:absolute; inset:0; display:grid; place-items:center; padding:12px; text-align:center; font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--d-muted); border:1px dashed var(--d-line); border-radius:inherit; }
.dm-credit{ position:absolute; right:6px; bottom:6px; font-family:var(--mono); font-size:9px; letter-spacing:.04em; color:#fff; background:rgba(0,0,0,.55); padding:2px 6px; border-radius:2px; }

.dm-h1{ margin:0; font-family:var(--d-head); font-weight:700; letter-spacing:-.025em; line-height:1.05; font-size:clamp(1.75rem, 1.2rem + 2.4cqi, 3rem); text-wrap:balance; }
.dm-h2{ margin:0; font-family:var(--d-head); font-weight:700; letter-spacing:-.015em; line-height:1.15; font-size:clamp(1.25rem, 1.05rem + .9cqi, 1.75rem); }
.dm-lede{ margin:10px 0 0; color:var(--d-muted); max-width:52ch; }
.dm-muted{ color:var(--d-muted); }
.dm-sec{ padding:28px 18px; border-top:1px solid var(--d-line); }

.dm-btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--d-acc); background:var(--d-acc); color:var(--d-acc-ink); border-radius:var(--d-rad); padding:12px 18px; font-weight:600; font-size:14px; transition:filter .2s var(--ease), transform .2s var(--ease); }
.dm-btn:hover{ filter:brightness(1.08); }
.dm-btn:active{ transform:translateY(1px); }
.dm-btn[disabled]{ opacity:.4; cursor:not-allowed; filter:none; }
.dm-btn.ghost{ background:transparent; color:var(--d-fg); border-color:var(--d-line); }

.dm-steps{ display:flex; gap:6px; flex-wrap:wrap; margin:18px 0 16px; }
.dm-step{ font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; padding:6px 10px; border-radius:999px; border:1px solid var(--d-line); color:var(--d-muted); background:transparent; }
.dm-step[aria-current="step"]{ color:var(--d-acc-ink); background:var(--d-acc); border-color:var(--d-acc); }
.dm-step.done{ color:var(--d-fg); border-color:var(--d-fg); }

.dm-opts{ display:grid; grid-template-columns:minmax(0,1fr); gap:10px; }
.dm-opt{ text-align:left; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:14px; background:var(--d-surf); border:1px solid var(--d-line); border-radius:var(--d-rad); transition:border-color .2s var(--ease), background-color .2s var(--ease); }
.dm-opt:hover{ border-color:var(--d-muted); }
.dm-opt[aria-pressed="true"]{ border-color:var(--d-acc-t, var(--d-acc)); box-shadow:inset 0 0 0 1px var(--d-acc-t, var(--d-acc)); }
.dm-opt strong{ display:block; font-weight:600; }
.dm-opt small{ display:block; color:var(--d-muted); font-size:13px; margin-top:2px; }
.dm-price{ font-family:var(--mono); font-size:13px; white-space:nowrap; font-variant-numeric:tabular-nums; }

.dm-chips{ display:flex; flex-wrap:wrap; gap:6px; }
.dm-chip{ padding:8px 12px; border:1px solid var(--d-line); background:transparent; border-radius:var(--d-rad); font-size:13px; font-variant-numeric:tabular-nums; }
.dm-chip small{ display:block; font-size:11px; color:var(--d-muted); }
.dm-chip[aria-pressed="true"]{ background:var(--d-acc); border-color:var(--d-acc); color:var(--d-acc-ink); }
.dm-chip[aria-pressed="true"] small{ color:inherit; opacity:.8; }
.dm-chip[disabled]{ text-decoration:line-through; opacity:.4; cursor:not-allowed; }

.dm-field{ display:flex; flex-direction:column; gap:6px; }
.dm-field label{ font-size:12px; font-weight:600; color:var(--d-muted); }
.dm-field input{ font:inherit; color:var(--d-fg); background:var(--d-surf); border:1px solid var(--d-line); border-radius:var(--d-rad); padding:11px 12px; }
.dm-field input:focus{ outline:none; border-color:var(--d-acc-t, var(--d-acc)); }
.dm-row{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
.dm-grid2{ display:grid; grid-template-columns:minmax(0,1fr); gap:12px; }

.dm-sum{ margin-top:16px; padding:14px; border:1px solid var(--d-line); border-radius:var(--d-rad); background:var(--d-surf); }
.dm-sum dl{ margin:0; display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:14px; }
.dm-sum dt{ color:var(--d-muted); }
.dm-sum dd{ margin:0; text-align:right; font-variant-numeric:tabular-nums; }
.dm-ok{ padding:18px; border-radius:var(--d-rad); border:1px solid var(--d-acc-t, var(--d-acc)); background:var(--d-surf); }
.dm-ok .dm-tag{ color:var(--d-acc-t, var(--d-acc)); }
.dm-note{ margin-top:12px; font-family:var(--mono); font-size:11px; letter-spacing:.04em; color:var(--d-muted); }
.dm-msg{ margin:10px 0 0; white-space:pre-wrap; font-family:var(--mono); font-size:12px; line-height:1.55; padding:12px; background:#0B141A; color:#E9EDEF; border-radius:8px; border-left:3px solid #25D366; }

.dm-tabs{ display:flex; gap:4px; overflow-x:auto; border-bottom:1px solid var(--d-line); scrollbar-width:none; }
.dm-tab{ background:transparent; border:0; border-bottom:2px solid transparent; padding:10px 12px; color:var(--d-muted); white-space:nowrap; font-size:14px; }
.dm-tab[aria-selected="true"]{ color:var(--d-fg); border-bottom-color:var(--d-acc-t, var(--d-acc)); }

.dm-items{ display:grid; grid-template-columns:minmax(0,1fr); gap:10px; margin-top:14px; }
.dm-item{ display:grid; grid-template-columns:72px minmax(0,1fr) auto; gap:12px; align-items:center; padding:10px; border:1px solid var(--d-line); border-radius:var(--d-rad); background:var(--d-surf); }
.dm-item .dm-img{ width:72px; height:72px; }
.dm-item strong{ display:block; font-family:var(--d-head); font-size:16px; }
.dm-item small{ display:block; color:var(--d-muted); font-size:13px; }
.dm-add{ width:36px; height:36px; border-radius:50%; border:1px solid var(--d-acc-t, var(--d-acc)); background:transparent; color:var(--d-acc-t, var(--d-fg)); font-size:18px; line-height:1; }
.dm-add[aria-pressed="true"]{ background:var(--d-acc); color:var(--d-acc-ink); border-color:var(--d-acc); }
.dm-qty{ display:inline-flex; align-items:center; gap:8px; font-variant-numeric:tabular-nums; }
.dm-qty button{ width:26px; height:26px; border:1px solid var(--d-line); background:transparent; border-radius:var(--d-rad); }
.dm-lines{ list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:8px; }
.dm-lines li{ display:flex; justify-content:space-between; gap:12px; align-items:center; font-size:14px; }
.dm-total{ display:flex; justify-content:space-between; margin-top:12px; padding-top:12px; border-top:1px solid var(--d-line); font-weight:700; font-variant-numeric:tabular-nums; }

.dm-classes{ list-style:none; margin:14px 0 0; padding:0; display:flex; flex-direction:column; }
.dm-class{ display:grid; grid-template-columns:56px minmax(0,1fr); gap:6px 14px; padding:14px 0; border-top:1px solid var(--d-line); align-items:center; }
.dm-class .t{ font-family:var(--mono); font-size:14px; font-variant-numeric:tabular-nums; }
.dm-class .act{ grid-column:2; display:flex; align-items:center; justify-content:space-between; gap:12px; }
.dm-cap{ flex:1; max-width:160px; height:4px; background:var(--d-line); border-radius:2px; overflow:hidden; }
.dm-cap i{ display:block; height:100%; background:var(--d-acc); transition:width .4s var(--ease); }
.dm-count{ font-family:var(--sans); font-weight:700; letter-spacing:-.04em; line-height:.9; font-size:clamp(3rem, 2rem + 6cqi, 6.5rem); color:var(--d-acc-t, var(--d-acc)); font-variant-numeric:tabular-nums; }
.dm-live{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* hero sobre foto: texto en un bloque sólido, nunca directo sobre la imagen */
.dm-cover{ position:relative; }
.dm-cover .dm-img{ aspect-ratio:16/10; border-radius:0; }
.dm-panel{ position:relative; margin:-40px 12px 0; padding:18px; background:var(--d-bg); border:1px solid var(--d-line); border-radius:var(--d-rad); }

.shot img{ display:block; width:100%; height:100%; object-fit:cover; transition:transform .9s var(--ease-slow); }
.card:hover .shot img,.card:focus-within .shot img{ transform:scale(1.03); }
.demo-others{ display:flex; flex-wrap:wrap; align-items:center; gap:12px 28px; margin-top:36px; padding-top:24px; border-top:1px solid var(--line); }

@container (min-width:768px){
  .dm-links{ display:flex; }
  .dm-pad,.dm-sec{ padding-left:28px; padding-right:28px; }
  .dm-opts{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  .dm-grid2{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  .dm-items{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  .dm-cover .dm-img{ aspect-ratio:21/9; }
  .dm-panel{ position:absolute; left:28px; bottom:28px; margin:0; max-width:420px; }
  .dm-split{ display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr); gap:28px; align-items:center; }
}
@container (min-width:1100px){
  .dm-layout{ display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:28px; align-items:start; }
  .dm-sticky{ position:sticky; top:calc(var(--hdr) + 16px); }
  .dm-opts.four{ grid-template-columns:repeat(4,minmax(0,1fr)); }
}
</style>
