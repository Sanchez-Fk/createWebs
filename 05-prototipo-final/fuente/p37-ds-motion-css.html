
<style>
/* ===========================================================================
   COREOGRAFÍAS POR OFICIO — cada demo habla un idioma de movimiento distinto.
   Dental: respira (desenfoque que se aclara, burbujas que se inflan)
   Restaurante: se encienden las luces (lento, cálido, editorial)
   Barbería: corte a navaja (rápido, mecánico, preciso)
   Gimnasio: impacto (golpe, rebote y ritmo)
   Todo cuelga de .m: sin movimiento no se oculta ni se anima nada.
   =========================================================================== */

/* ============================ DENTAL · RESPIRAR ============================ */
.m .rv-dxh .w{ display:inline-block; white-space:nowrap; }
.m .rv-dxh .ch{ display:inline-block; transition:opacity .9s var(--ease), filter .9s var(--ease), transform 1.1s var(--ease-slow); transition-delay:calc(var(--d, 0ms) + var(--i, 0) * 16ms); }
.m .rv-dxh.is-pre .ch{ opacity:0; filter:blur(10px); transform:translate3d(0, .18em, 0) scale(1.08); }

.m .rv-dxe{ transition:opacity 1s var(--ease), letter-spacing 1.4s var(--ease-slow); }
.m .rv-dxe.is-pre{ opacity:0; letter-spacing:.55em; }

.m .rv-dxm{ clip-path:circle(150% at 70% 40%); transition:clip-path 1.8s var(--ease-slow) var(--d, 0ms); }
.m .rv-dxm.is-pre{ clip-path:circle(0% at 70% 40%); }
.m .rv-dxm.is-pre img{ --sc:1.3; }

.m .rv-dxb{ transition:opacity 1s var(--ease), transform 1.2s var(--ease-slow), filter 1s var(--ease); transition-delay:var(--d, 0ms); }
.m .rv-dxb.is-pre{ opacity:0; transform:translate3d(0, 14px, 0) scale(.965); filter:blur(5px); }

.m .rv-dxc{ transition:opacity .7s var(--ease), transform .95s cubic-bezier(.34, 1.56, .64, 1), box-shadow .4s var(--ease); transition-delay:var(--d, 0ms); }
.m .rv-dxc.is-pre{ opacity:0; transform:scale(.86); }
.m .ds-dental .ds-card:hover{ transform:translateY(-4px); box-shadow:0 14px 34px rgba(31, 111, 168, .14); transition-delay:0ms; }

.m .rv-dxp{ position:relative; transition:opacity .8s var(--ease), transform .9s var(--ease-slow); transition-delay:var(--d, 0ms); }
.m .rv-dxp.is-pre{ opacity:0; transform:translate3d(-14px, 0, 0); }
.m .rv-dxp::before{ content:""; position:absolute; left:-14px; top:14px; bottom:14px; width:3px; border-radius:2px; background:var(--c-acc); transform:scaleY(0); opacity:0; }
.m .rv-dxp:not(.is-pre)::before{ animation:dxBar 1.3s var(--ease-slow) var(--d, 0ms) both; }
@keyframes dxBar{ 0%{ transform:scaleY(0); opacity:1; } 45%{ transform:scaleY(1); opacity:1; } 100%{ transform:scaleY(1); opacity:0; } }

.m .ds-dental .ds-float{ animation:dxFloat 5s ease-in-out infinite; }
@keyframes dxFloat{ 0%, 100%{ translate:0 0; } 50%{ translate:0 -6px; } }
.m .ds-dental .ds-btn:hover{ filter:none; box-shadow:0 0 0 6px color-mix(in srgb, var(--c-acc) 16%, transparent); transition:box-shadow .5s var(--ease-slow), background-color .3s var(--ease); }
.ds-dental .ds-toast{ background:#10263A; border-radius:999px; }

/* ====================== RESTAURANTE · ENCENDER LAS LUCES ====================== */
.m .rv-rsh .w{ display:inline-block; overflow:hidden; vertical-align:top; padding-bottom:.16em; margin-bottom:-.16em; }
.m .rv-rsh .w > span{ display:inline-block; transform-origin:0 100%; transition:transform 1.5s var(--ease-slow), opacity 1.2s var(--ease); transition-delay:calc(var(--d, 0ms) + var(--i, 0) * 90ms); }
.m .rv-rsh.is-pre .w > span{ opacity:0; transform:translate3d(0, 105%, 0) skewY(9deg); }

.m .rv-rse{ transition:opacity 1.6s var(--ease), transform 1.6s var(--ease-slow); }
.m .rv-rse.is-pre{ opacity:0; transform:translate3d(0, 10px, 0); }

.m .rv-rsm{ transition:filter 2.4s var(--ease) var(--d, 0ms); }
.m .rv-rsm.is-pre{ filter:brightness(.15) saturate(.4); }
/* la foto se asienta una sola vez (6 s) al encenderse y queda quieta: nada la mueve de forma continua */
.m .ds-rest .rv-rsm img{ transition:scale 6s cubic-bezier(.16, 1, .3, 1); }
.m .ds-rest .rv-rsm.is-pre img{ --sc:1.12; }

.m .rv-rsb{ transition:opacity 1.6s var(--ease), transform 1.8s var(--ease-slow), filter 1.8s var(--ease); transition-delay:var(--d, 0ms); }
.m .rv-rsb.is-pre{ opacity:0; transform:translate3d(0, 40px, 0); filter:brightness(.35); }

.m .rv-rsg{ clip-path:inset(0 0 0 0); transition:clip-path 1.6s var(--ease-slow) var(--d, 0ms); }
.m .rv-rsg.is-pre{ clip-path:inset(0 50% 0 50%); }
.m .rv-rsg img{ transition:transform 2.2s var(--ease-slow) var(--d, 0ms); }
.m .rv-rsg.is-pre img{ transform:scale(1.28); }
.m .rv-rsg figcaption{ transition:opacity 1s var(--ease), transform 1.2s var(--ease-slow); transition-delay:calc(var(--d, 0ms) + 700ms); }
.m .rv-rsg.is-pre figcaption{ opacity:0; transform:translate3d(0, 12px, 0); }
.m .ds-rest .rv-rsg:not(.is-pre):hover img{ transform:scale(1.07); transition:transform 1.6s var(--ease-slow); }

.m .rv-rsc{ transition:opacity 1.4s var(--ease), transform 1.6s var(--ease-slow), filter 1.4s var(--ease); transition-delay:var(--d, 0ms); }
.m .rv-rsc.is-pre{ opacity:0; transform:scale(1.06); filter:blur(8px); }

.m .ds-rest .ds-status .ds-dot{ animation:rsCandle 2.4s ease-in-out infinite; }
@keyframes rsCandle{ 0%, 100%{ opacity:1; } 30%{ opacity:.55; } 45%{ opacity:.9; } 70%{ opacity:.65; } }
.m .ds-rest .ds-btn{ transition:background-color .6s var(--ease), color .6s var(--ease), border-color .6s var(--ease), letter-spacing .7s var(--ease-slow); }
.m .ds-rest .ds-btn:hover{ filter:none; letter-spacing:.04em; }
.ds-rest .ds-toast{ background:#2A1D16; color:#F3E9D7; border:1px solid #3A2B22; transition-duration:.8s; }

/* ========================== BARBERÍA · CORTE A NAVAJA ========================== */
.m .rv-bbh{ position:relative; clip-path:inset(-25% -10% -25% -10%); transition:clip-path .8s cubic-bezier(.77, 0, .18, 1) var(--d, 0ms); }
.m .rv-bbh.is-pre{ clip-path:inset(-25% 100% -25% 0); }
.m .rv-bbh::after{ content:""; position:absolute; top:-6%; bottom:-6%; left:calc(100% - 3px); width:3px; background:var(--c-acc-t); opacity:0; pointer-events:none; transition:left .8s cubic-bezier(.77, 0, .18, 1) var(--d, 0ms), opacity .3s var(--ease) calc(var(--d, 0ms) + .78s); }
.m .rv-bbh.is-pre::after{ left:0; opacity:1; transition:none; }

.m .rv-bbe{ clip-path:inset(-20% -10% -20% -10%); transition:clip-path .55s cubic-bezier(.77, 0, .18, 1) var(--d, 0ms); }
.m .rv-bbe.is-pre{ clip-path:inset(-20% 100% -20% 0); }

.m .rv-bbm{ clip-path:polygon(0 0, 130% 0, 100% 100%, 0 100%); transition:clip-path 1s cubic-bezier(.77, 0, .18, 1) var(--d, 0ms); }
.m .rv-bbm.is-pre{ clip-path:polygon(0 0, 0 0, -30% 100%, 0 100%); }
.m .ds-barber .rv-bbm img{ transition:scale 1.1s cubic-bezier(.77, 0, .18, 1); }
.m .rv-bbm.is-pre img{ --sc:1.25; }

.m .rv-bbb{ clip-path:inset(-40px -40px -40px -40px); transition:clip-path .75s cubic-bezier(.77, 0, .18, 1), transform .75s cubic-bezier(.77, 0, .18, 1), opacity .3s var(--ease); transition-delay:var(--d, 0ms); }
.m .rv-bbb.is-pre{ clip-path:inset(0 100% 0 0); transform:translate3d(-16px, 0, 0); opacity:0; }

.m .rv-bbc{ transform-origin:0 100%; transition:opacity .4s var(--ease), transform .8s cubic-bezier(.77, 0, .18, 1); transition-delay:var(--d, 0ms); }
.m .rv-bbc.is-pre{ opacity:0; transform:translate3d(-40px, 24px, 0) rotate(-5deg); }
.m .ds-barber .ds-card:hover{ transform:rotate(-1deg); transition:transform .35s cubic-bezier(.77, 0, .18, 1); transition-delay:0ms; }

.m .rv-bbo{ font-variant-numeric:tabular-nums; }
.m .ds-barber .ds-btn--ghost{ box-shadow:inset 0 0 0 0 var(--c-fg); transition:box-shadow .45s cubic-bezier(.77, 0, .18, 1), color .45s cubic-bezier(.77, 0, .18, 1); }
.m .ds-barber .ds-btn--ghost:hover{ box-shadow:inset 420px 0 0 0 var(--c-fg); color:var(--c-bg); background:transparent; }
.m .ds-barber .ds-mark{ transition:transform .3s cubic-bezier(.77, 0, .18, 1); }
.m .ds-barber .ds-logo:hover .ds-mark{ transform:rotate(-12deg); }
.ds-barber .ds-toast{ left:18px; border-radius:0; background:#151311; transform:translate(-120%, 0); transition:opacity .2s var(--ease), transform .45s cubic-bezier(.77, 0, .18, 1); }
.ds-barber .ds-toast.on{ transform:translate(0, 0); }

/* ============================ GIMNASIO · IMPACTO ============================ */
.m .rv-gyh .w{ display:inline-block; vertical-align:top; }
.m .rv-gyh .w > span{ display:inline-block; transition:opacity .45s var(--ease), transform .7s cubic-bezier(.2, 1.5, .3, 1), filter .5s var(--ease); transition-delay:calc(var(--d, 0ms) + var(--i, 0) * 70ms); }
.m .rv-gyh.is-pre .w > span{ opacity:0; transform:scale(1.8); filter:blur(6px); }

.m .rv-gye{ position:relative; padding-bottom:6px; transition:opacity .3s var(--ease); }
.m .rv-gye::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:2px; background:var(--c-acc); transform-origin:0 50%; transition:transform .8s cubic-bezier(.2, .9, .2, 1) var(--d, 0ms); }
.m .rv-gye.is-pre{ opacity:0; }
.m .rv-gye.is-pre::after{ transform:scaleX(0); }

.m .rv-gym{ transition:filter .9s var(--ease) var(--d, 0ms); }
.m .rv-gym.is-pre{ filter:contrast(1.5) brightness(1.4); }
.m .rv-gym::after{ content:""; position:absolute; inset:0; background:var(--c-acc); opacity:0; pointer-events:none; transition:opacity .7s var(--ease) calc(var(--d, 0ms) + 80ms); }
.m .rv-gym.is-pre::after{ opacity:.55; transition:none; }
.m .ds-gym .rv-gym img{ transition:scale 1s cubic-bezier(.2, 1.2, .3, 1); }
.m .rv-gym.is-pre img{ --sc:1.5; }

.m .rv-gyb{ transition:opacity .5s var(--ease), transform .85s cubic-bezier(.2, 1.35, .3, 1); transition-delay:var(--d, 0ms); }
.m .rv-gyb.is-pre{ opacity:0; transform:translate3d(0, 64px, 0); }

.m .rv-gyc{ transition:opacity .45s var(--ease), transform .75s cubic-bezier(.2, 1.45, .3, 1); transition-delay:var(--d, 0ms); }
.m .rv-gyc.is-pre{ opacity:0; transform:scale(.78); }
.m .rv-gyc:not(.is-pre){ animation:gyFlash 1s var(--ease) var(--d, 0ms); }
@keyframes gyFlash{ 0%{ box-shadow:0 0 0 0 rgba(201, 255, 46, 0); } 30%{ box-shadow:0 0 0 2px rgba(201, 255, 46, .9); } 100%{ box-shadow:0 0 0 0 rgba(201, 255, 46, 0); } }

.m .ds-gym .ds-intro{ transform:skewY(var(--vskew, 0deg)); transition:transform .35s var(--ease); }
.m .ds-gym .ds-count{ transform-origin:0 50%; animation:gyBeat 1s cubic-bezier(.2, .8, .2, 1) infinite; }
@keyframes gyBeat{ 0%{ scale:1; } 12%{ scale:1.045; } 30%, 100%{ scale:1; } }
.m .ds-gym .ds-btn:not(.ds-btn--ghost):hover{ filter:none; animation:gyPulse 1s ease-out infinite; }
@keyframes gyPulse{ 0%{ box-shadow:0 0 0 0 rgba(201, 255, 46, .55); } 100%{ box-shadow:0 0 0 14px rgba(201, 255, 46, 0); } }
.m .ds-gym .ds-card:hover,
.m .ds-gym .ds-choice:hover{ border-color:var(--c-acc); transform:translateY(-3px); transition:transform .25s cubic-bezier(.2, 1.4, .3, 1), border-color .2s var(--ease); transition-delay:0ms; }
.ds-gym .ds-toast{ background:var(--c-acc); color:#0A0A0A; font-weight:700; transform:translate(-50%, 0) scale(.6); }
.ds-gym .ds-toast.on{ transform:translate(-50%, 0) scale(1); transition:opacity .2s var(--ease), transform .45s cubic-bezier(.2, 1.5, .3, 1); }
</style>
