
<script>
(function () {
  'use strict';

  var box = document.getElementById('box');
  var stage = document.getElementById('stage');
  var scroller = document.getElementById('scroller');
  var site = document.getElementById('site');
  var page = document.getElementById('page');
  var hdr = document.getElementById('hdr');
  var menu = document.getElementById('menu');

  /* Movimiento siempre activo, por decisión del cliente: el prototipo ya no tiene
     conmutador y no se apaga con prefers-reduced-motion. */
  var motionOn = true;
  var scale = 1;
  var lenis = null;
  var current = null;
  var demoCleanup = null;

  /* ---------------------------------------------------------------------------
     VISTA — siempre ajustada a la ventana; las consultas de contenedor ven el
     ancho real, así que 390 / 768 / 1440 responden igual que en un sitio normal
     --------------------------------------------------------------------------- */
  function layout() {
    var W = window.innerWidth, H = window.innerHeight;
    box.style.width = W + 'px'; box.style.height = H + 'px';
    stage.style.width = W + 'px';
    stage.style.height = H + 'px';
    stage.style.transform = 'none';
    stage.style.setProperty('--vh', H + 'px');
    grid.resize();
    if (lenis) lenis.resize();
  }

  /* ---------------------------------------------------------------------------
     LENIS — inercia con easing propio (design.md), nunca ease-in-out por defecto
     --------------------------------------------------------------------------- */
  function startLenis() {
    if (lenis || !window.Lenis) return;
    try {
      lenis = new window.Lenis({
        wrapper: scroller, content: site, duration: 1.15,
        easing: function (t) { return Math.min(1, 1.001 - Math.pow(2, -10 * t)); }
      });
      var loop = function (time) { if (!lenis) return; lenis.raf(time); requestAnimationFrame(loop); };
      requestAnimationFrame(loop);
    } catch (e) { lenis = null; }
  }
  window.__scrollToEl = function (el, extra) {
    var top = scroller.scrollTop + (el.getBoundingClientRect().top - scroller.getBoundingClientRect().top) / scale - hdr.offsetHeight - 16 - (extra || 0);
    if (lenis) lenis.scrollTo(top); else scroller.scrollTo({ top: top, behavior: 'smooth' });
  };

  function applyMotion() {
    stage.classList.add('m');
    startLenis();
    grid.draw();
  }

  /* ---------------------------------------------------------------------------
     ROUTER — #/es/proyectos ⇄ #/en/work
     --------------------------------------------------------------------------- */
  function parse() {
    var parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    var l = parts[0];
    if (l !== 'es' && l !== 'en') return null;
    var slug = parts[1] || '', sub = parts[2] || '', key = null;
    Object.keys(ROUTES[l]).forEach(function (k) { if (key === null && ROUTES[l][k] === slug) key = k; });
    if (key === null) return null;
    if (key === 'demo' && !sub) key = 'home';
    return { l: l, key: key, sub: key === 'demo' ? sub : '' };
  }
  function goDefault() {
    try { history.replaceState(null, '', '#/es/'); } catch (e) { location.hash = '#/es/'; }
  }

  function render(r, fresh) {
    var go = function () {
      if (demoCleanup) { try { demoCleanup(); } catch (err) { /* limpieza silenciosa */ } demoCleanup = null; }
      current = r;
      document.documentElement.lang = r.l;
      hdr.innerHTML = r.key === 'demo' ? DemoBar(r.l, r.sub) : Header(r.l, r.key, r.sub);
      hdr.classList.toggle('is-demo', r.key === 'demo');
      menu.innerHTML = r.key === 'demo' ? '' : Menu(r.l, r.key, r.sub);
      menu.hidden = true;
      try { page.innerHTML = r.key === 'demo' ? PAGES.demo(r.l, r.sub) : PAGES[r.key](r.l); }
      catch (err) {
        console.error('[página] no se pudo generar', r.key, err);
        page.innerHTML = '<section class="page-head"><div class="wrap"><p class="mono">' + (r.l === 'es' ? 'Esta página no pudo cargarse.' : 'This page could not load.') + '</p><p style="margin-top:16px"><a class="link-mono" href="#/' + r.l + '/">' + (r.l === 'es' ? 'Ir al inicio' : 'Go home') + ' →</a></p></div></section>';
      }
      if (r.key === 'demo') {
        var sid = Object.prototype.hasOwnProperty.call(DEMOS, r.sub) ? r.sub : 'dental';
        var dRoot = document.getElementById('demoRoot'), dm = DEMOS[sid], offDemo = null, offBg = null;
        if (dRoot && dm && typeof dm.mount === 'function') {
          try { offDemo = dm.mount(dRoot, r.l) || null; }
          catch (err) {
            console.error('[demo] no se pudo montar', sid, err);
            dRoot.className = '';
            dRoot.innerHTML = '<div style="padding:120px 24px;text-align:center"><p class="mono">' + (r.l === 'es' ? 'La demo no pudo cargarse.' : 'The demo could not load.') + '</p><p style="margin-top:16px"><a class="link-mono" href="' + href(r.l, 'home') + '">' + (r.l === 'es' ? 'Volver al portafolio' : 'Back to portfolio') + ' →</a></p></div>';
          }
          if (dRoot.classList.contains('ds') || dRoot.querySelector('.ds')) {
            try { offBg = DSBG.mount(dRoot, sid, function () { return motionOn; }); }
            catch (err) { console.error('[demo] fondo animado desactivado', err); }
          }
          demoCleanup = function () { if (typeof offDemo === 'function') offDemo(); if (typeof offBg === 'function') offBg(); };
        }
      }
      document.title = 'José M. Sánchez · ' + T[r.l].titles[r.key];
      if (lenis) { lenis.start(); lenis.scrollTo(0, { immediate: true, force: true }); }
      scroller.scrollTop = 0;
      onScroll();
      bind();
      reveals(fresh);
      page.classList.remove('is-out');
      if (!fresh) page.focus({ preventScroll: true });
    };
    if (fresh) { go(); return; }
    page.classList.add('is-out');               /* fundido corto: sin cortina ni loader */
    setTimeout(go, 170);
  }

  /* ---------------------------------------------------------------------------
     REVELADOS
     · Hero: máscara hacia arriba, 80ms entre líneas; el resto sube 24px después
     · Tarjetas, filas y bloques: coreografías de MOTION al entrar en pantalla
     --------------------------------------------------------------------------- */
  function reveals(fresh) { MOTION.run(page, hdr, fresh); }

  /* ---------------------------------------------------------------------------
     HEADER, MENÚ, FORMULARIO, ENLACES EXTERNOS
     --------------------------------------------------------------------------- */
  function onScroll() { hdr.classList.toggle('is-scrolled', scroller.scrollTop > 8); }
  scroller.addEventListener('scroll', onScroll, { passive: true });

  function setMenu(open) {
    menu.hidden = !open;
    var mb = document.getElementById('menuBtn');
    if (mb) mb.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) { if (lenis) lenis.stop(); var a = menu.querySelector('a'); if (a) a.focus(); }
    else { if (lenis) lenis.start(); if (mb) mb.focus(); }
  }
  function bind() {
    var mb = document.getElementById('menuBtn'), mc = document.getElementById('menuClose');
    if (mb) mb.onclick = function () { setMenu(true); };
    if (mc) mc.onclick = function () { setMenu(false); };
    var form = document.getElementById('form');
    if (form) form.onsubmit = function (e) { e.preventDefault(); document.getElementById('formNote').hidden = false; };
  }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !menu.hidden) setMenu(false); });

  /* enlaces de ejemplo (#wa, #gh…): un aviso breve en lugar de navegar */
  var note = document.createElement('div');
  note.className = 'proto-note';
  note.setAttribute('role', 'status');
  note.setAttribute('aria-live', 'polite');
  stage.appendChild(note);
  var flashT;
  stage.addEventListener('click', function (e) {
    var a = e.target.closest ? e.target.closest('a[href^="#"]') : null;
    if (!a) return;
    var h = a.getAttribute('href');
    if (h.indexOf('#/') === 0 || a.closest('.ds')) return;
    e.preventDefault();
    var names = { '#wa': 'WhatsApp', '#mail': 'Email', '#gh': 'GitHub', '#li': 'LinkedIn', '#ig': 'Instagram' };
    note.textContent = (current && current.l === 'en' ? 'External link in production: ' : 'Enlace externo en producción: ') + (names[h] || h);
    note.classList.add('on');
    clearTimeout(flashT);
    flashT = setTimeout(function () { note.classList.remove('on'); }, 2400);
  });

  /* ---------------------------------------------------------------------------
     HUD INTERACTIVO (p65-hud) — sustituye a la retícula de puntos de design.md
     --------------------------------------------------------------------------- */
  var grid = HUD({
    canvas: document.getElementById("grid"),
    stage: stage,
    isMotion: function () { return motionOn; },
    getScale: function () { return scale; },
    getScroll: function () { return scroller.scrollTop; },
    getLang: function () { return current ? current.l : "es"; }
  });

  MOTION.init({
    hdr: hdr,
    stage: stage,
    scroller: scroller,
    isOn: function () { return motionOn; },
    getScale: function () { return scale; }
  });

  var rT;
  window.addEventListener('resize', function () { clearTimeout(rT); rT = setTimeout(layout, 150); });
  window.addEventListener('hashchange', function () {
    var r = parse();
    if (!r) { goDefault(); r = parse() || { l: 'es', key: 'home', sub: '' }; }
    render(r, false);
  });

  /* ---------------------------------------------------------------------------
     ARRANQUE
     --------------------------------------------------------------------------- */
  if (!parse()) goDefault();
  layout();
  applyMotion();
  render(parse() || { l: 'es', key: 'home', sub: '' }, true);
})();
</script>
