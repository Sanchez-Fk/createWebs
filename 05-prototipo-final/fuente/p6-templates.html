
<script>
/* ===========================================================================
   PLANTILLAS — un componente por bloque, igual que la arquitectura Astro
   (Header, Hero, WorkCard, ServiceList, ClosingBlock, Footer…)
   =========================================================================== */
function href(l, key, sub) {
  var slug = ROUTES[l][key];
  return '#/' + l + '/' + (slug ? slug : '') + (sub ? '/' + sub : '');
}
function other(l) { return l === 'es' ? 'en' : 'es'; }

function Header(l, key, sub) {
  var t = T[l], o = other(l);
  function nav(k) { return '<a href="' + href(l, k) + '"' + (key === k ? ' aria-current="page"' : '') + '>' + t[k] + '</a>'; }
  return '<div class="hdr-in" data-hdr>' +
    '<a class="wordmark" href="' + href(l, 'home') + '">José M. Sánchez</a>' +
    '<div class="hdr-r">' +
      '<nav class="nav" aria-label="' + t.navLabel + '">' + nav('work') + nav('services') + nav('contact') + '</nav>' +
      '<span class="hdr-div" aria-hidden="true"></span>' +
      '<div class="lang">' +
        '<a href="' + href('es', key, sub) + '" hreflang="es" lang="es"' + (l === 'es' ? ' aria-current="true"' : ' aria-label="' + t.langTo + '"') + '>ES</a>' +
        '<span aria-hidden="true">/</span>' +
        '<a href="' + href('en', key, sub) + '" hreflang="en" lang="en"' + (l === 'en' ? ' aria-current="true"' : ' aria-label="' + t.langTo + '"') + '>EN</a>' +
      '</div>' +
      '<button class="menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="menu">' + t.menu + '</button>' +
    '</div></div>';
}

function Menu(l, key, sub) {
  var t = T[l];
  function item(k) { return '<a href="' + href(l, k) + '"' + (key === k ? ' aria-current="page"' : '') + '>' + t[k] + '<span>→</span></a>'; }
  return '<div class="menu-top"><span class="wordmark">José M. Sánchez</span>' +
    '<button class="menu-btn" id="menuClose" type="button" style="display:block">' + t.close + '</button></div>' +
    '<nav class="menu-links" aria-label="' + t.navLabel + '">' + item('home') + item('work') + item('services') + item('contact') + '</nav>' +
    '<div class="menu-foot"><a class="btn btn-primary" href="#wa">' + t.wa + '</a>' +
    '<div class="lang"><a href="' + href('es', key, sub) + '"' + (l === 'es' ? ' aria-current="true"' : '') + '>ES</a><span>/</span>' +
    '<a href="' + href('en', key, sub) + '"' + (l === 'en' ? ' aria-current="true"' : '') + '>EN</a></div></div>';
}

function WorkCard(l, s) {
  var c = s[l];
  return '<article class="card" data-rv="card" data-sector="' + s.id + '" style="--y:32px">' +
    '<div class="shot">' + (s.img && IMG[s.img] ? '<img src="' + IMG[s.img] + '" alt="" decoding="async">' : s.svg) + '</div>' +
    '<p class="sector">' + c.sector + '</p>' +
    '<h3>' + c.title + '</h3>' +
    '<p class="card-copy">' + c.copy + '</p>' +
    '<div class="card-meta"><div class="tags">' + s.tags.map(function (g) { return '<span class="tag">' + g + '</span>'; }).join('') + '</div>' +
    '<a class="link-mono" href="' + href(l, 'demo', s.id) + '">' + T[l].demoLink + ' <span class="arw" aria-hidden="true">→</span></a></div>' +
  '</article>';
}

function ServiceList(l, target) {
  return '<ol class="svc">' + SERVICES[l].map(function (s, i) {
    return '<li data-rv="row"><a class="row" href="' + href(l, target) + '">' +
      '<span class="num">0' + (i + 1) + '</span><span class="name">' + s[0] + '</span>' +
      '<p class="desc">' + s[1] + '</p><span class="arw" aria-hidden="true">→</span></a></li>';
  }).join('') + '</ol>';
}

function ClosingBlock(l) {
  var t = T[l];
  return '<section class="sec closing" aria-labelledby="h-close"><div class="wrap" data-rv="fade" style="--y:0px">' +
    '<h2 class="h-closing" id="h-close"><span>' + t.closeL1 + '</span><span>' + t.closeL2 + '</span></h2>' +
    '<a class="btn btn-primary btn-lg" href="#wa">' + t.wa + ' <span class="arw" aria-hidden="true">→</span></a>' +
    '<span class="meta">' + t.closeMeta + '</span></div></section>';
}

function Footer(l, key, sub) {
  var t = T[l];
  return '<footer class="ft"><div class="wrap">' +
    '<div class="ft-row"><a class="wordmark" href="' + href(l, 'home') + '">José M. Sánchez</a>' +
    '<nav class="social" aria-label="' + t.ftSocial + '"><a href="#gh">GitHub</a><a href="#li">LinkedIn</a><a href="#ig">Instagram</a></nav></div>' +
    '<div class="ft-row"><span class="meta">' + t.copy + '</span>' +
    '<div class="lang"><a href="' + href('es', key, sub) + '"' + (l === 'es' ? ' aria-current="true"' : '') + '>ES</a><span>/</span>' +
    '<a href="' + href('en', key, sub) + '"' + (l === 'en' ? ' aria-current="true"' : '') + '>EN</a></div></div>' +
  '</div></footer>';
}

function FooterExpanded(l) {
  var t = T[l];
  function a(k) { return '<a href="' + href(l, k) + '">' + t[k] + '</a>'; }
  return '<footer class="ft"><div class="wrap"><div class="ft-x">' +
    '<div class="ft-brand"><a class="wordmark" href="' + href(l, 'home') + '">José M. Sánchez</a><p>' + t.ftTag + '</p></div>' +
    '<div class="ft-col"><span class="mono">' + t.ftNav + '</span>' + a('home') + a('work') + a('services') + a('contact') + '</div>' +
    '<div class="ft-col"><span class="mono">' + t.ftContact + '</span><a href="#wa">WhatsApp</a><a href="#mail">Email</a></div>' +
    '<div class="ft-col"><span class="mono">' + t.ftSocial + '</span><a href="#gh">GitHub</a><a href="#li">LinkedIn</a><a href="#ig">Instagram</a></div>' +
    '</div><div class="ft-row"><span class="meta">' + t.copy + '</span>' +
    '<div class="lang"><a href="' + href('es', 'contact') + '"' + (l === 'es' ? ' aria-current="true"' : '') + '>ES</a><span>/</span>' +
    '<a href="' + href('en', 'contact') + '"' + (l === 'en' ? ' aria-current="true"' : '') + '>EN</a></div></div>' +
  '</div></footer>';
}

/* ---------------------------------------------------------------------------
   PÁGINAS
   --------------------------------------------------------------------------- */
function Stats(l) {
  var S = l === 'es'
    ? [[4, 2, '', 'demos de sector funcionando'], [24, 0, ' h', 'tiempo máximo de respuesta'], [2, 0, '', 'idiomas: español e inglés'], [1, 0, '', 'persona, de principio a fin']]
    : [[4, 2, '', 'working sector demos'], [24, 0, ' h', 'maximum response time'], [2, 0, '', 'languages: Spanish and English'], [1, 0, '', 'person, start to finish']];
  return '<div class="stats">' + S.map(function (x) {
    var v = String(x[0]); while (v.length < x[1]) v = '0' + v;
    return '<div class="stat"><b data-count="' + x[0] + '" data-pad="' + x[1] + '" data-suffix="' + x[2] + '">' + v + x[2] + '</b><span>' + x[3] + '</span></div>';
  }).join('') + '</div>';
}

function DemoBar(l, id) {
  var t = T[l], s = SECTORS.filter(function (x) { return x.id === id; })[0] || SECTORS[0];
  return '<div class="dbar">' +
    '<a class="link-mono" href="' + href(l, 'home') + '"><span aria-hidden="true">←</span> ' + (l === 'es' ? 'Portafolio' : 'Portfolio') + '</a>' +
    '<span class="dbar-title">' + t.demoLabel + ' · <b>' + s[l].title + '</b></span>' +
    '<span style="display:flex;align-items:center;gap:18px"><nav class="dbar-others" aria-label="' + t.demoOthers + '">' +
      SECTORS.filter(function (x) { return x.id !== s.id; }).map(function (o) { return '<a href="' + href(l, 'demo', o.id) + '">' + o[l].sector + '</a>'; }).join('') + '</nav>' +
    '<span class="lang"><a href="' + href('es', 'demo', s.id) + '"' + (l === 'es' ? ' aria-current="true"' : '') + '>ES</a><span>/</span><a href="' + href('en', 'demo', s.id) + '"' + (l === 'en' ? ' aria-current="true"' : '') + '>EN</a></span></span></div>';
}

var PAGES = {
  home: function (l) {
    var t = T[l];
    return '<section class="hero" aria-labelledby="h-hero"><div class="wrap">' +
        '<p class="eyebrow" data-rv="hero" style="--d:240ms">' + t.heroEyebrow + '</p>' +
        '<h1 class="h-display" id="h-hero"><span class="mask is-pre" style="--d:0ms"><span>' + t.heroL1 + '</span></span>' +
        '<span class="mask is-pre" style="--d:80ms"><span>' + t.heroL2 + '</span></span></h1>' +
        '<p class="lede" data-rv="hero" style="--d:300ms">' + t.heroLede + '</p>' +
        '<div class="hero-acts" data-rv="hero" style="--d:360ms"><a class="btn btn-primary" href="#wa">' + t.wa + '</a>' +
        '<a class="link-arrow" href="' + href(l, 'work') + '">' + t.heroLink + ' <span class="arw" aria-hidden="true">→</span></a></div>' +
        '<div class="scroll-ind" data-rv="hero" style="--d:420ms"><span class="scroll-line" aria-hidden="true"></span><span class="mono">' + t.scroll + '</span></div>' +
      '</div></section>' +

      '<section class="value" aria-label="' + (l === 'es' ? 'Propuesta de valor' : 'Value proposition') + '"><div class="wrap" data-rv="fade" style="--y:0px">' +
        '<p class="statement">' + t.value + '</p><span class="meta">' + t.valueMeta + '</span>' + Stats(l) + '</div></section>' +

      '<section class="sec" aria-labelledby="h-work" style="padding-top:0"><div class="wrap">' +
        '<div class="sec-head"><h2 class="mono" id="h-work" style="margin:0">' + t.workLabel + '</h2><p>' + t.workNote + '</p></div>' +
        '<div class="work-grid">' + SECTORS.map(function (s) { return WorkCard(l, s); }).join('') + '</div>' +
        '<div class="sec-foot"><a class="link-mono" href="' + href(l, 'work') + '">' + t.workAll + ' <span class="arw" aria-hidden="true">→</span></a></div>' +
      '</div></section>' +

      '<section class="sec" aria-labelledby="h-svc"><div class="wrap">' +
        '<div class="sec-head" style="border-bottom:0;padding-bottom:0"><h2 class="mono" id="h-svc" style="margin:0">' + t.svcLabel + '</h2><p>' + t.svcNote + '</p></div>' +
        ServiceList(l, 'services') +
        '<div class="sec-foot"><a class="link-mono" href="' + href(l, 'services') + '">' + t.svcAll + ' <span class="arw" aria-hidden="true">→</span></a></div>' +
      '</div></section>' +
      ClosingBlock(l) + Footer(l, 'home');
  },

  work: function (l) {
    var t = T[l];
    return '<section class="page-head"><div class="wrap" data-rv="hero">' +
        '<span class="mono">' + t.pWorkLabel + '</span><h1 class="h-page">' + t.pWorkH + '</h1><p class="lede">' + t.pWorkLede + '</p></div></section>' +
      '<section class="sec" style="padding-top:0" aria-label="' + t.pWorkLabel + '"><div class="wrap"><div class="work-grid">' +
        SECTORS.map(function (s) { return WorkCard(l, s); }).join('') + '</div></div></section>' +
      ClosingBlock(l) + Footer(l, 'work');
  },

  services: function (l) {
    var t = T[l];
    return '<section class="page-head"><div class="wrap" data-rv="hero">' +
        '<span class="mono">' + t.pSvcLabel + '</span><h1 class="h-page">' + t.pSvcH + '</h1><p class="lede">' + t.pSvcLede + '</p></div></section>' +
      '<section class="sec" style="padding-top:0" aria-label="' + t.pSvcLabel + '"><div class="wrap">' + ServiceList(l, 'contact') + '</div></section>' +
      '<section class="sec" aria-labelledby="h-proc"><div class="wrap">' +
        '<div class="sec-head" style="border-bottom:0;padding-bottom:0"><h2 class="mono" id="h-proc" style="margin:0">' + t.processLabel + '</h2><p>' + t.processNote + '</p></div>' +
        '<ol class="steps">' + STEPS[l].map(function (s, i) {
          return '<li class="step" data-rv="row"><span class="num">0' + (i + 1) + '</span><h3>' + s[0] + '</h3><p>' + s[1] + '</p></li>';
        }).join('') + '</ol></div></section>' +
      ClosingBlock(l) + Footer(l, 'services');
  },

  contact: function (l) {
    var t = T[l];
    return '<section class="sec contact"><div class="wrap contact-grid">' +
        '<div class="c-left" data-rv="hero">' +
          '<h1 class="h-page"><span style="display:block">' + t.cH1 + '</span><span style="display:block;color:var(--fg-2)">' + t.cH2 + '</span></h1>' +
          '<p class="lede">' + t.cLede + '</p>' +
          '<a class="btn btn-primary btn-lg" href="#wa">WhatsApp <span class="arw" aria-hidden="true">→</span></a>' +
          '<dl class="facts"><div><dt>' + t.fResp + '</dt><dd>' + t.fRespV + '</dd></div>' +
          '<div><dt>' + t.fTz + '</dt><dd>' + t.fTzV + '</dd></div>' +
          '<div><dt>' + t.fLang + '</dt><dd>' + t.fLangV + '</dd></div></dl>' +
        '</div>' +
        '<div class="c-right" data-rv="hero" style="--d:120ms">' +
          '<h2 class="mono" style="margin:0">' + t.formLabel + '</h2>' +
          '<form class="form" id="form" novalidate>' +
            '<div class="field"><label for="f-name">' + t.fName + '</label><input id="f-name" name="name" autocomplete="name"></div>' +
            '<div class="field"><label for="f-mail">' + t.fMail + '</label><input id="f-mail" name="email" type="email" autocomplete="email"></div>' +
            '<div class="field"><label for="f-biz">' + t.fBiz + '</label><textarea id="f-biz" name="business" placeholder="' + t.fBizPh + '"></textarea></div>' +
            '<button class="btn btn-secondary" type="submit">' + t.fSend + '</button>' +
            '<p class="form-note" id="formNote" hidden role="status">' + t.fNote + '</p>' +
          '</form></div>' +
      '</div></section>' + FooterExpanded(l);
  },

  demo: function () {
    return '<div class="demo-page"><div id="demoRoot"></div></div>';
  }
};
</script>
