
<div class="vp" id="vp">
  <div class="vp-box" id="box">
    <div class="stage" id="stage">
      <canvas id="grid" aria-hidden="true"></canvas>
      <div class="scroller" id="scroller">
        <div class="site" id="site">
          <main class="page" id="page" tabindex="-1"></main>
        </div>
      </div>
      <header class="hdr" id="hdr"></header>
      <div class="menu" id="menu" hidden></div>
      <div class="grain" aria-hidden="true"></div>
    </div>
  </div>
</div>

<div class="bar" role="toolbar" aria-label="Controles del prototipo">
  <div class="bar-g" role="group" aria-label="Ancho de vista">
    <span>Vista</span>
    <button type="button" data-vw="fit" aria-pressed="true">Ajustar</button>
    <button type="button" data-vw="1440" aria-pressed="false">1440</button>
    <button type="button" data-vw="768" aria-pressed="false">768</button>
    <button type="button" data-vw="390" aria-pressed="false">390</button>
  </div>
  <div class="bar-g" role="group" aria-label="Movimiento">
    <span>Movimiento</span>
    <button type="button" id="motionBtn" aria-pressed="true">Activo</button>
  </div>
  <div class="bar-g" role="group" aria-label="Acento pendiente">
    <span>Acento</span>
    <button type="button" class="sw" style="--c:#E0A200" data-accent="#E0A200" aria-pressed="true" title="#E0A200 — design.md" aria-label="Acento #E0A200, de design.md"></button>
    <button type="button" class="sw" style="--c:#FFB000" data-accent="#FFB000" aria-pressed="false" title="#FFB000 — artefactos previos" aria-label="Acento #FFB000, de los artefactos previos"></button>
  </div>
  <span class="bar-route" id="routeLabel">/es/</span>
</div>
