<title>Six Second Blueprint</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
/* ===========================================================================
   TOKENS — Phosphor Hairline v1.0
   =========================================================================== */
:root{
  color-scheme: dark;
  --bg:      #0D0D0D;
  --s1:      #161616;
  --s2:      #1C1C1C;
  --line:    #262626;
  --line-hi: #3A3A3A;
  --fg:      #EFEFEF;
  --fg-2:    #8A8A8A;
  --accent:  #FFB000;
  --r: 2px;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
}

*, *::before, *::after{ box-sizing: border-box; }

html, body{ height: 100%; }
body{
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--f-mono);
  overflow: hidden;
}

#cv{
  position: fixed;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  z-index: 0;
}

/* ===========================================================================
   HUD — review chrome, not part of the piece
   =========================================================================== */
.hud{
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 12px;
  max-width: calc(100vw - 32px);
  flex-wrap: wrap;
  justify-content: center;
  background: rgba(18,18,18,.86);
  border: 1px solid var(--line);
  border-radius: var(--r);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
.hud button{
  font-family: var(--f-mono);
  font-size: .6875rem;
  font-weight: 500;
  letter-spacing: .12em;
  text-transform: uppercase;
  background: transparent;
  color: var(--fg-2);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 7px 11px;
  cursor: pointer;
  white-space: nowrap;
  transition: color .16s ease, border-color .16s ease, background-color .16s ease;
}
.hud button:hover{ color: var(--fg); border-color: var(--line-hi); }
.hud button[aria-pressed="true"]{ color: var(--fg); background: var(--s2); border-color: var(--line-hi); }

.track{ position: relative; width: 240px; height: 22px; flex: none; }
.rail{ position: absolute; inset: 50% 0 auto; height: 1px; background: var(--line); transform: translateY(-50%); }
.fill{ position: absolute; left: 0; top: 50%; height: 1px; width: 0%; background: var(--accent); transform: translateY(-50%); }
.ticks{ position: absolute; inset: 0; display: flex; justify-content: space-between; }
.ticks i{ width: 1px; height: 100%; background: var(--line); display: block; }
.ticks i:first-child, .ticks i:last-child{ background: var(--line-hi); }
.head{ position: absolute; top: 50%; left: 0; width: 1px; height: 14px; background: var(--fg); transform: translate(-50%, -50%); }

.clock{
  font-size: .6875rem;
  letter-spacing: .06em;
  color: var(--fg-2);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.clock b{ color: var(--fg); font-weight: 500; }

.note{
  position: fixed;
  left: 50%;
  bottom: 78px;
  transform: translateX(-50%);
  z-index: 10;
  font-size: .6875rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--fg-2);
  background: rgba(18,18,18,.86);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 6px 10px;
  backdrop-filter: blur(14px);
}
.note[hidden]{ display: none !important; }

:where(button):focus-visible{ outline: 2px solid var(--accent); outline-offset: 3px; border-radius: var(--r); }

@media (max-width: 600px){ .track{ width: 160px; } }
</style>

<canvas id="cv"></canvas>

<div class="note" id="note" hidden>Reduced motion &mdash; frozen frame</div>

<div class="hud">
  <button type="button" id="play">Pause</button>
  <div class="track" role="img" aria-label="Six second loop timeline">
    <div class="rail"></div>
    <div class="fill" id="fill"></div>
    <div class="ticks"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="head" id="head"></div>
  </div>
  <span class="clock"><b id="clock">0.00</b> / 6.00s</span>
  <button type="button" id="seam">Jump to seam</button>
  <button type="button" id="grainBtn" aria-pressed="true">Grain</button>
</div>

<script>
(function(){
  "use strict";

  /* =========================================================================
     THE LOOP CONTRACT
     Everything drawn is a pure function of (t mod 6). Each element owns a
     window [start, start+dur) computed with modular arithmetic, and its alpha
     both begins and ends at exactly 0. Two consequences:
       · the state at t=0 and t=6 is identical, so there is no cut;
       · an element whose window crosses the boundary (see CORNER ARC, which
         starts at 5.0s) simply continues into the next cycle.
     No easing into the wrap, no crossfade, nothing to hide.
     ========================================================================= */
  var LOOP = 6.0;
  var GRAIN_FPS = 12;      /* 8 tiles at 12fps = 0.667s, which divides 6.0 exactly */
  var GRAIN_TILES = 8;

  var ACCENT = '255,176,0';      /* #FFB000 — the one line that is not off-white */
  var OFFWHITE = '239,239,239';  /* #EFEFEF */

  var cv   = document.getElementById('cv');
  var ctx  = cv.getContext('2d');
  var note = document.getElementById('note');
  var fillEl = document.getElementById('fill');
  var headEl = document.getElementById('head');
  var clockEl = document.getElementById('clock');
  var playBtn = document.getElementById('play');
  var seamBtn = document.getElementById('seam');
  var grainBtn = document.getElementById('grainBtn');

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var W = 0, H = 0, S = 0, CX = 0, CY = 0, DPR = 1;
  var vignette = null;
  var grainOn = true;

  /* ---- unit space -> pixels ---------------------------------------------
     y is up, origin centred. S is the half-height unit, capped so the wide
     composition still fits on a narrow screen. */
  function X(u){ return CX + u * S; }
  function Y(v){ return CY - v * S; }

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth;
    H = cv.clientHeight;
    cv.width  = Math.max(1, Math.floor(W * DPR));
    cv.height = Math.max(1, Math.floor(H * DPR));
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    S  = Math.min(H / 2, W / 2 / 1.5) * 0.94;
    CX = W / 2;
    CY = H / 2;

    vignette = ctx.createRadialGradient(CX, CY, Math.min(W, H) * 0.20, CX, CY, Math.max(W, H) * 0.78);
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, 'rgba(0,0,0,0.55)');
  }

  /* ---- easing ------------------------------------------------------------ */
  function clamp01(x){ return x < 0 ? 0 : (x > 1 ? 1 : x); }
  function easeInOut(x){ x = clamp01(x); return x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2; }
  function smooth(a, b, x){ return easeInOut(clamp01((x - a) / (b - a))); }

  /* ---- element lifecycle -------------------------------------------------
     u        0 .............................................. 1
     draw     |=========>|                 (0    -> 0.46, eased)
     alpha    /‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾\      (in by 0.07, out from 0.68)
     Both ends sit at 0, which is what makes the wrap invisible. */
  function windowAt(t, start, dur){
    var x = (t - start) % LOOP;
    if (x < 0) x += LOOP;
    if (x >= dur) return null;
    var u = x / dur;
    return { u: u, p: easeInOut(clamp01(u / 0.46)), a: Math.min(smooth(0, 0.07, u), 1 - smooth(0.68, 1.0, u)) };
  }

  /* ---- primitives -------------------------------------------------------- */
  function stroke(rgb, alpha, width){
    ctx.strokeStyle = 'rgba(' + rgb + ',' + alpha.toFixed(4) + ')';
    ctx.lineWidth = width || 1;
    ctx.lineCap = 'butt';
    ctx.lineJoin = 'miter';
    ctx.stroke();
  }

  /* draws the first `p` of a polyline's total arc length */
  function poly(pts, p){
    if (p <= 0 || pts.length < 2) return;
    var segs = [], total = 0, i, d;
    for (i = 1; i < pts.length; i++){
      d = Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]);
      segs.push(d); total += d;
    }
    var target = total * p, acc = 0;
    ctx.beginPath();
    ctx.moveTo(X(pts[0][0]), Y(pts[0][1]));
    for (i = 1; i < pts.length; i++){
      d = segs[i-1];
      if (acc + d <= target){
        ctx.lineTo(X(pts[i][0]), Y(pts[i][1]));
        acc += d;
      } else {
        var f = d === 0 ? 0 : (target - acc) / d;
        ctx.lineTo(
          X(pts[i-1][0] + (pts[i][0] - pts[i-1][0]) * f),
          Y(pts[i-1][1] + (pts[i][1] - pts[i-1][1]) * f)
        );
        break;
      }
    }
  }

  /* canvas angles run clockwise on a y-down surface; unit space is y-up */
  function arc(cx, cy, r, a0, a1, p){
    if (p <= 0) return;
    var a = a0 + (a1 - a0) * p;
    ctx.beginPath();
    ctx.arc(X(cx), Y(cy), r * S, -a0, -a, (a1 - a0) > 0);
  }

  /* ---- the drawing -------------------------------------------------------
     Architectural vocabulary, not decoration: a datum line, a setting-out
     grid, a compass sweep, a dimension line with end ticks, surveyor's
     crosses at the intersections, and an angle marker. Placed off-centre and
     low, so the upper right stays empty.
     ========================================================================= */
  var ELEMENTS = [

    /* 01 · DATUM — the long low reference line */
    { start: 0.0, dur: 3.4, draw: function(w){
        poly([[-1.36, -0.42], [0.56, -0.42]], w.p);
        stroke(OFFWHITE, 0.52 * w.a, 1);
      }},

    /* 02 · SETTING-OUT GRID — faintest thing on screen, builds column by column */
    { start: 0.5, dur: 3.0, draw: function(w){
        var x0 = -1.16, x1 = -0.36, y0 = -0.14, y1 = 0.46, i, sp;
        for (i = 0; i <= 4; i++){
          sp = clamp01((w.p - i * 0.055) / 0.62);
          poly([[x0 + (x1-x0) * i/4, y0], [x0 + (x1-x0) * i/4, y1]], easeInOut(sp));
          stroke(OFFWHITE, 0.11 * w.a, 1);
        }
        for (i = 0; i <= 3; i++){
          sp = clamp01((w.p - 0.14 - i * 0.055) / 0.62);
          poly([[x0, y0 + (y1-y0) * i/3], [x1, y0 + (y1-y0) * i/3]], easeInOut(sp));
          stroke(OFFWHITE, 0.11 * w.a, 1);
        }
      }},

    /* 03 · VERTICAL — crosses the datum, drawn top down */
    { start: 1.0, dur: 3.2, draw: function(w){
        poly([[-0.62, 0.80], [-0.62, -0.74]], w.p);
        stroke(OFFWHITE, 0.46 * w.a, 1);
      }},

    /* 04 · COMPASS SWEEP — the one curve, in the open right half */
    { start: 1.6, dur: 3.6, draw: function(w){
        arc(0.20, 0.06, 0.62, -0.42 * Math.PI, 0.86 * Math.PI, w.p);
        stroke(OFFWHITE, 0.34 * w.a, 1);
      }},

    /* 05 · THE ACCENT LINE — longest window, so it is the one thing that
       persists while the off-white construction comes and goes */
    { start: 2.2, dur: 4.2, accent: true, draw: function(w){
        poly([[-1.30, 0.64], [0.94, -0.68]], w.p);
        stroke(ACCENT, 0.92 * w.a, 1);
      }},

    /* 06 · FIGURE — a rectangle drawn as one continuous perimeter */
    { start: 3.0, dur: 3.0, draw: function(w){
        poly([[-0.20, 0.22], [0.46, 0.22], [0.46, -0.30], [-0.20, -0.30], [-0.20, 0.22]], w.p);
        stroke(OFFWHITE, 0.40 * w.a, 1);
      }},

    /* 07 · DIMENSION LINE — end tick, span, end tick, as one path */
    { start: 3.8, dur: 2.8, draw: function(w){
        poly([[-0.62, 0.68], [-0.62, 0.56], [-0.62, 0.62], [0.18, 0.62], [0.18, 0.68], [0.18, 0.56]], w.p);
        stroke(OFFWHITE, 0.38 * w.a, 1);
      }},

    /* 08 · SURVEYOR'S CROSSES — set on the real intersections */
    { start: 4.4, dur: 2.6, draw: function(w){
        var nodes = [[-0.62, -0.42], [0.20, 0.06], [-0.20, 0.22]], k = 0.052, i, sp, n;
        for (i = 0; i < nodes.length; i++){
          n = nodes[i];
          sp = easeInOut(clamp01((w.p - i * 0.16) / 0.52));
          poly([[n[0] - k, n[1]], [n[0] + k, n[1]]], sp);
          stroke(OFFWHITE, 0.60 * w.a, 1);
          poly([[n[0], n[1] - k], [n[0], n[1] + k]], sp);
          stroke(OFFWHITE, 0.60 * w.a, 1);
        }
      }},

    /* 09 · ANGLE MARKER — window crosses the loop boundary and simply carries on */
    { start: 5.0, dur: 2.8, draw: function(w){
        arc(-0.62, -0.42, 0.17, 0, 0.5 * Math.PI, w.p);
        stroke(OFFWHITE, 0.30 * w.a, 1);
      }}
  ];

  /* ---- film grain --------------------------------------------------------
     Eight pre-rendered tiles cycled at 12fps. 8/12 = 0.667s, an exact divisor
     of the six-second loop, so the grain wraps with everything else. */
  var tiles = [], patterns = [];
  function buildGrain(){
    var n = 128, i, j, c, g, img, d, v;
    for (i = 0; i < GRAIN_TILES; i++){
      c = document.createElement('canvas');
      c.width = c.height = n;
      g = c.getContext('2d');
      img = g.createImageData(n, n);
      d = img.data;
      for (j = 0; j < d.length; j += 4){
        v = Math.random();
        d[j] = d[j+1] = d[j+2] = 255;
        d[j+3] = Math.floor(Math.pow(v, 2.2) * 255);   /* skewed dark: sparse bright specks */
      }
      g.putImageData(img, 0, 0);
      tiles.push(c);
      patterns.push(ctx.createPattern(c, 'repeat'));
    }
  }
  buildGrain();

  /* ---- frame -------------------------------------------------------------- */
  function render(t){
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#0D0D0D';
    ctx.fillRect(0, 0, W, H);

    for (var i = 0; i < ELEMENTS.length; i++){
      var e = ELEMENTS[i];
      var w = windowAt(t, e.start, e.dur);
      if (w && w.a > 0.001) e.draw(w);
    }

    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);

    if (grainOn){
      var idx = Math.floor(t * GRAIN_FPS) % GRAIN_TILES;
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.045;
      ctx.fillStyle = patterns[idx];
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  /* ---- clock -------------------------------------------------------------
     Opens at 4.5s: the accent line is fully drawn and holding, the figure is
     set, the dimension line is still arriving. A representative frame rather
     than an empty one. */
  var t = 4.5;
  var playing = !reduced;
  var last = performance.now();

  if (reduced){
    note.hidden = false;
    playBtn.disabled = true;
    playBtn.textContent = 'Play';
  }

  function hud(){
    var pct = (t / LOOP) * 100;
    fillEl.style.width = pct + '%';
    headEl.style.left = pct + '%';
    clockEl.textContent = t.toFixed(2);
  }

  function frame(now){
    var dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    if (playing && !document.hidden){
      t = (t + dt) % LOOP;
      render(t);
      hud();
    }
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', function(){ resize(); render(t); });
  resize();
  render(t);
  hud();
  requestAnimationFrame(frame);

  /* ---- controls ----------------------------------------------------------- */
  playBtn.addEventListener('click', function(){
    playing = !playing;
    playBtn.textContent = playing ? 'Pause' : 'Play';
    last = performance.now();
  });

  seamBtn.addEventListener('click', function(){
    t = LOOP - 0.6;
    if (!playing){ playing = true; playBtn.textContent = 'Pause'; }
    last = performance.now();
    render(t); hud();
  });

  grainBtn.addEventListener('click', function(){
    grainOn = !grainOn;
    grainBtn.setAttribute('aria-pressed', grainOn ? 'true' : 'false');
    render(t);
  });
})();
</script>
