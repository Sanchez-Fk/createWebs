<meta charset="utf-8">
<title>Eight Second Drift</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400&display=swap">

<style>
/* ===========================================================================
   TOKENS — Phosphor Hairline v1.0
   =========================================================================== */
:root{
  color-scheme: dark;
  --bg:      #0F0F0F;
  --s1:      #161616;
  --s2:      #1C1C1C;
  --line:    #262626;
  --line-hi: #3A3A3A;
  --fg:      #EFEFEF;
  --fg-2:    #8A8A8A;
  --accent:  #FFB000;
  --accent-ink: #0F0F0F;
  --r: 2px;
  --f-display: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --f-body:    'IBM Plex Sans', system-ui, 'Segoe UI', Roboto, sans-serif;
  --f-mono:    'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}

*, *::before, *::after{ box-sizing: border-box; }

html, body{ height: 100%; }
body{
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--f-body);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* the loop itself */
#gl{
  position: fixed;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  z-index: 0;
}

/* CSS stand-in if WebGL is unavailable — static, but the right colour world */
.fallback{
  position: fixed;
  inset: 0;
  z-index: 0;
  background:
    radial-gradient(60% 50% at 12% 8%, rgba(255,176,0,.055), transparent 70%),
    radial-gradient(90% 70% at 40% 20%, rgba(255,255,255,.045), transparent 72%),
    #0D0D0D;
}
.fallback[hidden]{ display: none !important; }

/* ===========================================================================
   OVERLAY — the hero copy, so "never distracting" is actually testable
   =========================================================================== */
.ov{
  position: fixed;
  inset: 0;
  z-index: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 0 clamp(24px, 4.4vw, 64px) clamp(120px, 14vh, 168px);
  pointer-events: none;
}
.ov[hidden]{ display: none !important; }
.ov-inner{ width: 100%; max-width: 1280px; margin-inline: auto; }
.eyebrow{
  margin: 0 0 26px;
  font-family: var(--f-mono);
  font-size: .75rem;
  font-weight: 500;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--fg-2);
}
.title{
  margin: 0;
  font-family: var(--f-display);
  font-weight: 700;
  font-size: clamp(2.25rem, 0.55rem + 5.4vw, 4.25rem);
  line-height: .95;
  letter-spacing: -.045em;
}
.title span{ display: block; }
.title span:last-child{ color: var(--fg-2); }
.support{
  margin: 30px 0 0;
  max-width: 60ch;
  font-size: 1.125rem;
  line-height: 1.6;
  color: var(--fg-2);
}

/* ===========================================================================
   HUD — review chrome, not part of the piece
   =========================================================================== */
.hud{
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 12px;
  max-width: calc(100vw - 32px);
  flex-wrap: wrap;
  justify-content: center;
  background: rgba(18,18,18,.86);
  border: 1px solid var(--line);
  border-radius: var(--r);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
.hud button{
  font-family: var(--f-mono);
  font-size: .6875rem;
  font-weight: 500;
  letter-spacing: .12em;
  text-transform: uppercase;
  background: transparent;
  color: var(--fg-2);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 7px 11px;
  cursor: pointer;
  white-space: nowrap;
  transition: color .16s ease, border-color .16s ease, background-color .16s ease;
}
.hud button:hover{ color: var(--fg); border-color: var(--line-hi); }
.hud button[aria-pressed="true"]{ color: var(--fg); background: var(--s2); border-color: var(--line-hi); }

/* 8-second timeline, one tick per second */
.track{
  position: relative;
  width: 260px;
  height: 22px;
  flex: none;
}
.rail{
  position: absolute;
  inset: 50% 0 auto;
  height: 1px;
  background: var(--line);
  transform: translateY(-50%);
}
.fill{
  position: absolute;
  left: 0;
  top: 50%;
  height: 1px;
  width: 0%;
  background: var(--accent);
  transform: translateY(-50%);
}
.ticks{
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: space-between;
}
.ticks i{ width: 1px; height: 100%; background: var(--line); display: block; }
.ticks i:first-child, .ticks i:last-child{ background: var(--line-hi); }
.head{
  position: absolute;
  top: 50%;
  left: 0;
  width: 1px;
  height: 14px;
  background: var(--fg);
  transform: translate(-50%, -50%);
}
.clock{
  font-family: var(--f-mono);
  font-size: .6875rem;
  letter-spacing: .06em;
  color: var(--fg-2);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.clock b{ color: var(--fg); font-weight: 500; }

.note{
  position: fixed;
  left: 50%;
  bottom: 78px;
  transform: translateX(-50%);
  z-index: 10;
  font-family: var(--f-mono);
  font-size: .6875rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--fg-2);
  background: rgba(18,18,18,.86);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 6px 10px;
  backdrop-filter: blur(14px);
}
.note[hidden]{ display: none !important; }

:where(a, button):focus-visible{
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: var(--r);
}

@media (max-width: 600px){
  .track{ width: 180px; }
  .ov{ padding-bottom: 200px; }
}
</style>

<canvas id="gl"></canvas>
<div class="fallback" id="fallback" hidden></div>

<div class="ov" id="ov">
  <div class="ov-inner">
    <p class="eyebrow">Web developer &mdash; available worldwide</p>
    <h1 class="title">
      <span>Websites that bring you customers.</span>
      <span>Not decoration.</span>
    </h1>
    <p class="support">I build fast, modern sites for small businesses. One person, start to finish.</p>
  </div>
</div>

<div class="note" id="note" hidden>Reduced motion &mdash; frozen frame</div>

<div class="hud">
  <button type="button" id="play">Pause</button>
  <div class="track" role="img" aria-label="Eight second loop timeline">
    <div class="rail"></div>
    <div class="fill" id="fill"></div>
    <div class="ticks"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="head" id="head"></div>
  </div>
  <span class="clock"><b id="clock">0.00</b> / 8.00s</span>
  <button type="button" id="seam">Jump to seam</button>
  <button type="button" id="ovBtn" aria-pressed="true">Overlay</button>
</div>

<script id="vs" type="x-shader/x-vertex">
attribute vec2 a_pos;
void main(){ gl_Position = vec4(a_pos, 0.0, 1.0); }
</script>

<script id="fs" type="x-shader/x-fragment">
precision highp float;

uniform vec2  u_res;
uniform float u_p;        /* loop phase, 0..1 */
uniform float u_gi;       /* grain frame index, integer, wraps with the loop */
uniform vec3  u_accent;

/* --------------------------------------------------------------------------
   Value noise + fbm. Cheap, smooth, and more than enough for haze — this is
   atmosphere, not terrain.
   -------------------------------------------------------------------------- */
float hash21(vec2 p){
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

float vnoise(vec2 p){
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

float fbm(vec2 p){
  float v = 0.0;
  float a = 0.5;
  for(int i = 0; i < 4; i++){
    v += a * vnoise(p);
    p = p * 2.03 + vec2(11.7, 3.1);
    a *= 0.5;
  }
  return v;
}

/* --------------------------------------------------------------------------
   One frame of the piece at an arbitrary linear phase. Nothing in here loops
   on its own — the seamlessness is handled in main().
   -------------------------------------------------------------------------- */
vec3 field(vec2 p, vec2 st, float ph){

  /* --- drifting haze, one domain warp ---------------------------------- */
  vec2 drift = vec2(0.085, -0.055) * ph;          /* the whole 8s travels ~0.1 units */
  vec2 q = vec2(fbm(p * 1.15 + drift),
                fbm(p * 1.15 + drift + 5.2));
  float h = fbm(p * 1.60 + drift + 0.55 * q);
  h = smoothstep(0.22, 0.95, h);

  /* --- volumetric shaft, upper-left to lower-right ---------------------- */
  vec2  dir  = normalize(vec2(0.78, -0.62));
  float s    = dot(p, dir);
  float off  = mix(-1.25, 1.25, ph);
  float band = exp(-pow((s - off) / 0.62, 2.0));
  band *= 0.35 + 0.85 * h;                        /* the haze is what makes light visible */

  /* --- compose ---------------------------------------------------------- */
  vec3 col = vec3(0.052);                         /* deep near-black. never #000000 */
  col += vec3(0.026, 0.027, 0.030) * h;           /* haze sits a touch cool */
  col += vec3(0.042, 0.040, 0.036) * band;        /* the shaft, a touch warm */

  /* --- accent temperature, upper-left corner only ------------------------
     Multiplied by corner falloff, a slow breath and the haze itself, so it
     never resolves into a shape you can point at. */
  float corner  = 1.0 - smoothstep(0.0, 0.92, length(st - vec2(0.0, 1.0)));
  float breathe = 0.62 + 0.38 * sin(6.2831853 * ph);   /* 2π-periodic: safe across the seam */
  col += u_accent * corner * breathe * (0.30 + 0.70 * h) * 0.075;

  return col;
}

void main(){
  vec2 fc = gl_FragCoord.xy;
  vec2 st = fc / u_res;
  vec2 p  = (fc - 0.5 * u_res) / u_res.y;    /* aspect-correct, so haze never stretches */

  /* ------------------------------------------------------------------------
     THE SEAM, SOLVED BY CONSTRUCTION.
     Every animated term is linear in phase, so instead of trying to land the
     motion back where it started, the frame cross-fades with a copy of itself
     one full period behind:
        p = 0  ->  mix(f(0),  f(-1), 0) = f(0)
        p = 1  ->  mix(f(1),  f(0),  1) = f(0)
     Identical first and last frame, no easing, no cut. It costs two evaluations
     of field() per pixel, which for haze this soft is nothing.
     ------------------------------------------------------------------------ */
  vec3 col = mix(field(p, st, u_p), field(p, st, u_p - 1.0), u_p);

  /* vignette — deepens the corners without crushing them */
  float v = 1.0 - 0.30 * pow(length((st - 0.5) * vec2(1.15, 1.0)), 2.1);
  col *= v;

  /* fine film grain, quantised to 24fps so it wraps with everything else */
  float g = hash21(fc + u_gi * 37.13);
  col += (g - 0.5) * 0.020;

  col = max(col, vec3(0.043));               /* floor at ~#0B0B0B */
  gl_FragColor = vec4(col, 1.0);
}
</script>

<script>
(function(){
  var LOOP     = 8.0;     /* seconds */
  var GRAIN_FPS = 24.0;   /* grain resamples 192 times per loop, then repeats */
  var ACCENT   = [1.0, 0.690, 0.0];   /* #FFB000 — the only colour to change */

  var canvas   = document.getElementById('gl');
  var fallback = document.getElementById('fallback');
  var note     = document.getElementById('note');
  var fillEl   = document.getElementById('fill');
  var headEl   = document.getElementById('head');
  var clockEl  = document.getElementById('clock');
  var playBtn  = document.getElementById('play');
  var seamBtn  = document.getElementById('seam');
  var ovBtn    = document.getElementById('ovBtn');
  var ov       = document.getElementById('ov');

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var gl = null;
  try {
    gl = canvas.getContext('webgl', { antialias: false, alpha: false, depth: false, powerPreference: 'low-power' })
      || canvas.getContext('experimental-webgl');
  } catch (e) { gl = null; }

  if (!gl){
    canvas.hidden = true;
    fallback.hidden = false;
    note.textContent = 'WebGL unavailable — static fallback';
    note.hidden = false;
    playBtn.disabled = true;
    seamBtn.disabled = true;
    return;
  }

  function compile(type, src){
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
      throw new Error(gl.getShaderInfoLog(s));
    }
    return s;
  }

  var prog;
  try {
    prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER,   document.getElementById('vs').textContent));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)){
      throw new Error(gl.getProgramInfoLog(prog));
    }
  } catch (err){
    canvas.hidden = true;
    fallback.hidden = false;
    note.textContent = 'Shader failed — static fallback';
    note.hidden = false;
    return;
  }

  gl.useProgram(prog);

  /* one fullscreen triangle — no index buffer, no quad seam */
  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, 'a_pos');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  var uRes    = gl.getUniformLocation(prog, 'u_res');
  var uP      = gl.getUniformLocation(prog, 'u_p');
  var uGi     = gl.getUniformLocation(prog, 'u_gi');
  var uAccent = gl.getUniformLocation(prog, 'u_accent');
  gl.uniform3fv(uAccent, ACCENT);

  function resize(){
    var dpr = Math.min(window.devicePixelRatio || 1, 1.75);
    var w = Math.max(1, Math.floor(canvas.clientWidth  * dpr));
    var h = Math.max(1, Math.floor(canvas.clientHeight * dpr));
    if (canvas.width !== w || canvas.height !== h){
      canvas.width = w;
      canvas.height = h;
      gl.viewport(0, 0, w, h);
    }
    gl.uniform2f(uRes, canvas.width, canvas.height);
  }
  window.addEventListener('resize', resize);
  resize();

  /* ---- clock ------------------------------------------------------------- */
  var t = reduced ? 1.6 : 0;
  var playing = !reduced;
  var last = performance.now();

  if (reduced){
    note.hidden = false;
    playBtn.disabled = true;
    playBtn.textContent = 'Play';
  }

  function draw(){
    var phase = t / LOOP;
    gl.uniform1f(uP, phase);
    gl.uniform1f(uGi, Math.floor(t * GRAIN_FPS));
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    var pct = phase * 100;
    fillEl.style.width = pct + '%';
    headEl.style.left = pct + '%';
    clockEl.textContent = t.toFixed(2);
  }

  function frame(now){
    var dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    if (playing && !document.hidden){
      t = (t + dt) % LOOP;
      resize();
      draw();
    }
    requestAnimationFrame(frame);
  }

  draw();
  requestAnimationFrame(frame);

  /* ---- controls ---------------------------------------------------------- */
  playBtn.addEventListener('click', function(){
    playing = !playing;
    playBtn.textContent = playing ? 'Pause' : 'Play';
    last = performance.now();
  });

  /* drops in 0.6s before the wrap, so the seam arrives immediately instead of
     eight seconds from now */
  seamBtn.addEventListener('click', function(){
    t = LOOP - 0.6;
    if (!playing){ playing = true; playBtn.textContent = 'Pause'; }
    last = performance.now();
    draw();
  });

  ovBtn.addEventListener('click', function(){
    var on = ovBtn.getAttribute('aria-pressed') === 'true';
    ovBtn.setAttribute('aria-pressed', on ? 'false' : 'true');
    ov.hidden = on;
  });
})();
</script>
